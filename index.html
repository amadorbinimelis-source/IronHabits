<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rutina">
<title>Rutina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0A0A0D;--bg2:#111116;--card:#15151B;--card2:#1C1C24;--border:#25252E;
  --text:#F3F3F6;--muted:#8B8B99;--dim:#55555F;--acc:#22C55E;--danger:#EF4444;
  --r:18px;--nav:66px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--acc)}
input[type=date]{min-height:44px}
textarea{resize:vertical;min-height:64px;line-height:1.45}
::-webkit-scrollbar{width:0;height:0}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--nav) + env(safe-area-inset-bottom) + 28px)}
.view{display:none}.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.h1{font-size:1.8rem;font-weight:800;letter-spacing:-.6px;line-height:1.05}
.sub{color:var(--muted);font-size:.85rem;margin-top:3px}
.sub::first-letter{text-transform:uppercase}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:1.25rem;font-weight:600;flex:none}
.icon-btn.acc{background:var(--acc);border-color:var(--acc);color:#0A0A0D}
.top-actions{display:flex;gap:8px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.lbl{display:block;font-size:.7rem;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
.sec{font-size:.72rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}
.hint{font-size:.78rem;color:var(--muted);line-height:1.45;margin-top:8px}
.mt8{margin-top:8px}.mb12{margin-bottom:12px}

/* Semana */
.week{display:flex;align-items:center;gap:4px;margin-bottom:12px}
.wk-nav{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.wk-btn{font-size:.78rem;font-weight:800;color:var(--acc);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:8px 12px}
.wk-btn:active{transform:scale(.96)}
.wk-lbl{font-size:.78rem;font-weight:700;text-align:center;line-height:1.2}
.wk-lbl small{display:block;font-size:.66rem;color:var(--acc);font-weight:700}
.wk-days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px;border:1px solid transparent}
.wd-l{font-size:.66rem;font-weight:700;color:var(--muted)}
.wd-r{position:relative;width:32px;height:32px;display:grid;place-items:center}
.wd-r svg{position:absolute;inset:0}
.wd-r b{position:relative;font-size:.78rem;font-weight:700}
.wd.today .wd-l{color:var(--acc)}
.wd.sel{background:var(--card);border-color:var(--border)}
.wd.fut b{color:var(--muted)}

/* Resumen */
.sum{display:flex;align-items:center;gap:14px}
.sum-ring{position:relative;width:64px;height:64px;display:grid;place-items:center;flex:none}
.sum-ring svg{position:absolute;inset:0}
.sum-ring b{position:relative;font-size:.95rem;font-weight:800}
.sum-t{font-size:1.05rem;font-weight:700}
.sum-s{font-size:.8rem;color:var(--muted);margin-top:3px}
.back-today{font-size:.75rem;font-weight:700;color:var(--acc);padding:6px 10px;border:1px solid var(--border);border-radius:99px;margin-left:auto;flex:none}

/* Tarjeta de hábito */
.hc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 12px 12px 12px;margin-bottom:9px;transition:border-color .2s,opacity .2s}
.hc.done{border-color:color-mix(in srgb,var(--hc) 45%,var(--border))}
.hc.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.hc-row{display:flex;align-items:center;gap:11px}
.hc-ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.3rem;flex:none;background:color-mix(in srgb,var(--hc) 18%,transparent)}
.hc-ico.sm{width:36px;height:36px;border-radius:11px;font-size:1.1rem}
.hc-info{flex:1;min-width:0;padding:2px 0}
.hc-name{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc.done .hc-name{color:var(--muted)}
.hc-meta{font-size:.76rem;color:var(--muted);margin-top:3px}
.hc-ctl{display:flex;align-items:center;gap:6px;flex:none}
.ctl{position:relative;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;flex:none}
.ctl svg{position:absolute;inset:0}
.ctl-in{position:relative;font-weight:800;font-size:.78rem;color:var(--hc)}
.ctl.full{background:var(--hc)}
.ctl.full .ctl-in{color:#0A0A0D;font-size:1.15rem}
.ctl.run{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hc) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.ctl:disabled{opacity:.35}
.mini{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--border);font-weight:700;color:var(--muted)}
.hc-plan{margin-top:10px;background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--hc);border-radius:12px;padding:10px 12px;font-size:.86rem;line-height:1.5}
.pl-tag{font-size:.64rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--hc);margin-bottom:4px}
.pl-li{padding-left:14px;position:relative}
.pl-li::before{content:'';position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--hc)}
.pl-gap{height:6px}
.pl-h{font-weight:800;margin:2px 0 3px}
.hc-plan a{color:var(--hc);font-weight:700;text-decoration:none;display:inline-block;padding:3px 0}
.steps{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:.88rem;border-radius:10px}
.step .sb{width:22px;height:22px;border-radius:7px;border:2px solid var(--dim);display:grid;place-items:center;font-size:.75rem;font-weight:800;color:#0A0A0D;flex:none}
.step.on{color:var(--muted);text-decoration:line-through}
.step.on .sb{background:var(--hc);border-color:var(--hc)}
.step:disabled{opacity:.5}

.empty{text-align:center;padding:38px 18px}
.empty .big{font-size:2.6rem;margin-bottom:10px}
.empty h3{font-size:1.1rem;margin-bottom:6px}
.empty p{color:var(--muted);font-size:.86rem;line-height:1.5;margin-bottom:18px}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:.92rem;text-align:center}
.btn.pri{background:var(--acc);color:#0A0A0D}
.btn.ghost{background:var(--card2);border:1px solid var(--border)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:#FF8A8A;border:1px solid color-mix(in srgb,var(--danger) 30%,transparent)}
.btns{display:flex;gap:8px;margin-top:18px}
.btns .btn{flex:1}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:var(--card2);border:1px solid var(--border);margin-bottom:8px;font-weight:600;font-size:.92rem}
.row-btn small{display:block;font-weight:500;color:var(--muted);font-size:.75rem;margin-top:2px}
.row-btn.danger{color:#FF8A8A}

/* Nota */
.note textarea{background:transparent;border:none;padding:0;min-height:54px}

/* Lista de hábitos */
.hl{display:block;width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:9px}
.hl-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hl-name{flex:1;min-width:0;font-weight:700;font-size:.95rem}
.hl-name div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-sub{font-size:.74rem;color:var(--muted);font-weight:500;margin-top:2px}
.hl-pct{font-size:.8rem;font-weight:800;color:var(--hc)}
.hm{display:grid;gap:3px}
.hm i{display:block;border-radius:3px;aspect-ratio:1}
.hm-wrap{overflow-x:auto;padding-bottom:4px}
.hm-big{display:grid;gap:3px;width:max-content}
.hm-big i{display:block;width:13px;height:13px;border-radius:3px}
.hm-months{display:grid;gap:3px;width:max-content;font-size:.6rem;color:var(--muted);margin-bottom:4px;height:12px}
.hm-months span{white-space:nowrap;overflow:visible}

/* Stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-size:1.6rem;font-weight:800;letter-spacing:-.5px}
.kpi span{font-size:.72rem;color:var(--muted);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.bar i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--acc);min-height:3px;position:relative}
.bar i.cur{opacity:.55}
.bar span{font-size:.58rem;color:var(--muted)}
.bar em{font-style:normal;font-size:.58rem;color:var(--muted)}
.rk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.rk:last-child{border-bottom:none}
.rk-n{flex:1;min-width:0}
.rk-n div{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.rk-bar i{display:block;height:100%;border-radius:99px;background:var(--hc)}
.rk-p{font-size:.82rem;font-weight:800;width:44px;text-align:right}

/* Detalle */
.det-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}
.det-kpis div{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:10px 6px;text-align:center}
.det-kpis b{display:block;font-size:1.2rem;font-weight:800;color:var(--hc)}
.det-kpis span{font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* Editor */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:9px 13px;border-radius:11px;background:var(--bg2);border:1px solid var(--border);font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button.on{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:var(--acc);color:var(--text)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.types button{padding:11px;border-radius:13px;background:var(--bg2);border:1px solid var(--border)}
.types button b{display:block;font-size:.88rem}
.types button small{display:block;font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.3}
.types button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.emojis button{aspect-ratio:1;border-radius:10px;font-size:1.25rem;background:var(--bg2);border:1px solid var(--border);display:grid;place-items:center}
.emojis button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.colors{display:flex;flex-wrap:wrap;gap:9px}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--text)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:10px 0;border-radius:11px;background:var(--bg2);border:1px solid var(--border);font-weight:700;text-align:center;color:var(--muted)}
.days button.on{background:var(--acc);border-color:var(--acc);color:#0A0A0D}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.list-row .x{width:40px;height:44px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);color:var(--muted);flex:none}
.plan-day{margin-bottom:8px}
.plan-day .pd-l{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);font-size:.78rem}
.chip button{color:var(--muted);font-weight:700}
.dp-item{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:9px 11px;margin-bottom:6px;font-size:.8rem;display:flex;gap:8px;align-items:flex-start}
.dp-item div{flex:1;min-width:0;white-space:pre-wrap;color:var(--muted)}
.dp-item b{color:var(--text);display:block;margin-bottom:2px}

/* Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto;cursor:pointer}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100vh - env(safe-area-inset-top) - 70px);max-height:calc(100dvh - env(safe-area-inset-top) - 70px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--border);border-bottom:none;border-radius:24px 24px 0 0;z-index:210;transform:translateY(105%);transition:transform .32s cubic-bezier(.3,1.1,.5,1);padding:8px 18px calc(env(safe-area-inset-bottom) + 22px)}
.sheet.on{transform:none}
.sheet-top{position:sticky;top:-8px;z-index:5;background:var(--card);margin:-8px -18px 6px;padding:8px 12px 4px;display:flex;align-items:center;justify-content:center;touch-action:none}
.handle{width:40px;height:5px;border-radius:99px;background:var(--border);margin:6px auto 8px}
.sheet-x{position:absolute;right:10px;top:6px;width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--border);font-size:1.05rem;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center}
.sheet-title{font-size:1.2rem;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(12,12,16,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.66rem;font-weight:700;color:var(--dim)}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--acc)}

/* Agenda */
.ag-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ag-bar .seg{flex:1}
.ag-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.68rem;color:var(--muted);margin:2px 2px 12px}
.ag-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ag-day{position:relative;margin-left:0}
.ag-hour{position:absolute;left:0;right:0;border-top:1px solid var(--border)}
.ag-hour.alt{background:rgba(255,255,255,.018)}
.ag-hour::after{content:'';position:absolute;left:44px;right:0;top:50%;border-top:1px dashed rgba(255,255,255,.05)}
.ag-hour span{position:absolute;top:4px;left:0;width:40px;font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-ev{position:absolute;border-radius:9px;padding:3px 7px;font-size:.72rem;overflow:hidden;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card));cursor:pointer;line-height:1.25;text-align:left;color:var(--text)}
.ag-ev b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev small{display:block;color:var(--muted);font-size:.64rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-ev.short{display:flex;align-items:center;gap:6px;padding-top:0;padding-bottom:0}
.ag-ev.short b{display:inline;flex:1;min-width:0}
.ag-ev.short small{display:inline}
.ag-ev.libre{background:transparent;border:1px dashed var(--border);color:var(--dim)}
.ag-ev.libre b{font-weight:500}
.ag-ev.trayecto{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,var(--card)) 0 6px,var(--card) 6px 12px)}
.ag-ev.sueno{background:color-mix(in srgb,#475569 30%,var(--bg))}
.ag-ev.cancel{opacity:.38}
.ag-ev.cancel b{text-decoration:line-through}
.ag-ev .ok{color:var(--c);font-weight:800}
.ag-now{position:absolute;left:40px;right:0;height:2px;background:#EF4444;z-index:3}
.ag-now::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#EF4444}
.agw-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px 6px;-webkit-overflow-scrolling:touch}
.agw{display:grid;grid-template-columns:40px repeat(7,minmax(78px,1fr));min-width:600px}
.agw-hd{position:sticky;top:0;z-index:4;background:var(--bg);text-align:center;padding:6px 0 8px;cursor:pointer;border-bottom:1px solid var(--border)}
.agw-hd b{display:block;font-size:.66rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.agw-hd span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:.95rem;margin-top:2px}
.agw-hd.today span{background:var(--acc);color:#0A0A0D}
.agw-hd.sel b{color:var(--text)}
.agw-hrs{position:relative}
.agw-hrs span{position:absolute;right:6px;font-size:.66rem;font-weight:700;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.agw-day{position:relative;border-left:1px solid var(--border)}
.agw-ev{position:absolute;left:2px;right:2px;border-radius:6px;padding:2px 4px;overflow:hidden;background:color-mix(in srgb,var(--c) 30%,var(--card));border-left:3px solid var(--c);text-align:left;color:var(--text);line-height:1.15}
.agw-ev b{display:block;font-size:.62rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agw-ev small{display:block;font-size:.56rem;color:var(--muted);white-space:nowrap}
.agw-ev.cancel{opacity:.35}.agw-ev.cancel b{text-decoration:line-through}
.agw-h{font-size:.66rem;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.agw-h.today{color:var(--acc)}
.agw-col{position:relative;background:var(--card);border-radius:8px;cursor:pointer;border:1px solid var(--border)}
.agw-col.sel{border-color:var(--acc)}
.agw-b{position:absolute;left:2px;right:2px;border-radius:3px;background:var(--c);opacity:.9}
.agw-b.libre{background:transparent}
.agw-b.cancel{opacity:.25}
.agw-t{position:relative}
.agw-t span{position:absolute;right:2px;font-size:.55rem;color:var(--dim);transform:translateY(-50%)}
.badge{display:inline-block;font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--border);margin:6px 6px 0 0}
.badge.warn{color:#FBBF24;border-color:color-mix(in srgb,#FBBF24 40%,var(--border))}

const KEY='rutina_v1';
const COLORS=['#22C55E','#3B82F6','#EF4444','#F59E0B','#A855F7','#EC4899','#14B8A6','#F97316','#84CC16','#06B6D4','#E11D48','#8B5CF6','#EAB308','#64748B'];

  ['check','Sí / No','Lo haces o no'],

/* ═════════════ ESTADO ═════════════ */
const SCHEMA=3;
const PLAN_KEY='rutina_plan_v1'; // lo pesado (agenda y planes) va aparte y solo se guarda al cargar un plan
const DEF={v:1,schema:SCHEMA,habits:[],logs:{},notes:{},settings:{accent:'#22C55E'},timer:null,agenda:{},agendaBase:{},agendaUntil:'',classesKnownUntil:'',pauses:[],minDays:{},reviews:{},checkins:{},mocks:[]};
// Migraciones: cada versión del esquema añade lo que falta sin tocar los registros.
function migrate(s){
  s.schema=s.schema||1;
  if(s.schema<2){s.agenda=s.agenda||{};s.agendaBase=s.agendaBase||{};s.agendaUntil=s.agendaUntil||'';s.schema=2;}
  s.checkins=s.checkins||{};s.mocks=s.mocks||[];
  if(s.schema<3){s.pauses=s.pauses||[];s.minDays=s.minDays||{};s.reviews=s.reviews||{};s._needPlanSave=true;s.schema=3;}
  return s;
}
function load(){
  let st=null;
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.habits))st=migrate(Object.assign(JSON.parse(JSON.stringify(DEF)),s,{schema:s.schema||1}));}catch(e){}
  st=st||JSON.parse(JSON.stringify(DEF));
  try{const P=JSON.parse(localStorage.getItem(PLAN_KEY)||'null');
    if(P){if(P.agendaBase&&!Object.keys(st.agendaBase||{}).length){st.agendaBase=P.agendaBase;st.agendaUntil=P.agendaUntil||'';st.classesKnownUntil=P.classesKnownUntil||'';}
      for(const h of st.habits){const x=(P.habits||{})[h.id];if(x){h.plan=h.plan||{};if(x.program&&!h.plan.program)h.plan.program=x.program;if(x.guide&&!h.guide)h.guide=x.guide;if(x.minimal&&!h.minimal)h.minimal=x.minimal;}}}
  }catch(e){}
  return st;
}
const HEAVY=new Set(['agendaBase','program','guide','minimal']);
function savePlan(){
  try{const P={agendaBase:S.agendaBase,agendaUntil:S.agendaUntil,classesKnownUntil:S.classesKnownUntil,habits:{}};
    for(const h of S.habits){const x={};if(h.plan&&h.plan.program)x.program=h.plan.program;if(h.guide)x.guide=h.guide;if(h.minimal)x.minimal=h.minimal;if(Object.keys(x).length)P.habits[h.id]=x;}
    localStorage.setItem(PLAN_KEY,JSON.stringify(P));}catch(e){toast('⚠️ No se pudo guardar el plan');}

/* ═════════════ LÓGICA DE HÁBITOS ═════════════ */
function entry(h,k){return (S.logs[k]||{})[h.id];}
function progress(h,k){
  const e=entry(h,k);if(!e)return 0;
  if(e.min)return 1;
  if(h.type!=='time'&&e.mins>0)return 1;
  if(h.type==='check')return e.v?1:0;
  if(h.type==='checklist'){const n=h.steps.length;if(!n)return 0;return h.steps.filter(s=>(e.steps||[]).includes(s.id)).length/n;}
  return Math.min(1,(e.v||0)/(h.target||1));
}
function isDone(h,k){return progress(h,k)>=1;}

// ¿Toca según la frecuencia? (sin tener en cuenta el cupo semanal)
function isScheduled(h,k){
  if(k<h.start)return false;
  const s=h.schedule;
  switch(s.mode){
    case 'daily':return true;
    case 'weekdays':return (s.days||[]).includes(dow(k));
    case 'xweek':return true;
    case 'everyN':return diffDays(h.start,k)%Math.max(1,s.n||1)===0;
    case 'dates':return (s.dates||[]).includes(k);
  }
  return false;
}
/* Cambios de agenda (anular, mover, cambiar hora). Los hábitos usan el id «h:<id>». */
function tm(s){if(!s)return null;const[h,m]=s.split(':').map(Number);return h*60+m;}
function fmtT(m){m=Math.round(m);return `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;}
function agOv(k,id){return ((S.agenda||{})[k]||{})[id];}
function agSet(k,id,o){_wc=null;S.agenda=S.agenda||{};if(o){(S.agenda[k]=S.agenda[k]||{})[id]=o;}else if(S.agenda[k]){delete S.agenda[k][id];if(!Object.keys(S.agenda[k]).length)delete S.agenda[k];}}
function baseEvent(k,id){return ((S.agendaBase||{})[k]||[]).find(e=>e.id===id);}
function isCancelledH(h,k){const o=agOv(k,'h:'+h.id);return !!(o&&(o.cancel||o.moveTo));}
function movedFrom(h,k){const o=agOv(k,'in:'+h.id);return o&&!o.extra?o.from:null;}
function isExtra(h,k){const o=agOv(k,'in:'+h.id);return !!(o&&o.extra);}
function hasLog(h,k){return !!(S.logs[k]&&S.logs[k][h.id])&&isDone(h,k);}
function habitTime(h,k){
  const mi=agOv(k,'in:'+h.id);if(mi)return mi.start?{start:mi.start,end:mi.end}:null;
  const o=agOv(k,'h:'+h.id);if(o&&o.start)return{start:o.start,end:o.end};
  const b=baseEvent(k,'h:'+h.id);return b?{start:b.start,end:b.end}:null;
}
function classCancelled(k){const o=agOv(k,'clase');return !!(o&&o.cancel);}
function momentOfTime(s){const m=tm(s);return m<14*60?'manana':m<20*60?'tarde':'noche';}
function hasDatePlan(h,k){return !!(h.plan&&((h.plan.dates&&h.plan.dates[k])||(h.plan.program&&h.plan.program[k])));}
function showOnBase(h,k){if(hasLog(h,k))return true;if(movedFrom(h,k))return true;if(isCancelledH(h,k))return false;return isScheduled(h,k)||hasDatePlan(h,k);}
/* Volumen semanal (como los km de Runna): minutos hechos frente a minutos planificados en la semana.
   Si cumples el total, los días que no hiciste no cuentan como fallo. Anular un día NO baja el objetivo (lo puedes compensar);
   una pausa (vacaciones, lesión) sí lo baja. */
var _wc=null;function wcache(){if(!_wc){_wc=new Map();queueMicrotask(()=>_wc=null);}return _wc;}
function evDur(h,k){const t=habitTime(h,k);return t&&t.start?tm(t.end)-tm(t.start):typicalDur(h);}
function minParse(t){const m=/(\d+)\s*min/.exec(t||'');return m?+m[1]:10;}
function minsOf(h,k){
  const e=entry(h,k);if(!e)return 0;
  if(h.type==='time')return e.v||0;
  if(e.mins!=null)return e.mins;
  if(e.min)return minParse(h.minimal);
  const p=progress(h,k);return p>0?Math.round(evDur(h,k)*p):0;
}
function isPaused(h,k){const o=agOv(k,'h:'+h.id);return !!(o&&o.pause);}
function plannedMins(h,k){
  if(k<h.start||isPaused(h,k))return 0;
  if(h.schedule.mode==='xweek')return 0;
  if(!(isScheduled(h,k)||hasDatePlan(h,k)))return 0;
  const b=baseEvent(k,'h:'+h.id);return b?tm(b.end)-tm(b.start):(h.type==='time'&&h.target?h.target:typicalDur(h));
}
function weekGoal(h,k){
  const ws=weekStartK(k),c=wcache(),key='g'+h.id+ws;if(c.has(key))return c.get(key);

  if(h.weekGoal)g=h.weekGoal;
  else if(h.schedule.mode==='xweek'){if(addDays(ws,6)>=h.start)g=(h.schedule.times||1)*typicalDur(h);}
  else for(let i=0;i<7;i++)g+=plannedMins(h,addDays(ws,i));

}
function weekMins(h,k){const ws=weekStartK(k),c=wcache(),key='m'+h.id+ws;if(c.has(key))return c.get(key);let m=0;for(let i=0;i<7;i++)m+=minsOf(h,addDays(ws,i));c.set(key,m);return m;}
function weekMet(h,k){const g=weekGoal(h,k);return g>0&&weekMins(h,k)>=g;}
// Un día que tocaba y no hiciste: ¿es fallo? No si la semana va en curso (aún puedes compensar) o si cumpliste el total.
function missCounts(h,k){const t=todayK();if(weekStartK(k)===weekStartK(t))return false;return !weekMet(h,k);}
function fmtDur(m){m=Math.round(m);return m>=60?`${Math.floor(m/60)} h${m%60?' '+pad(m%60):''}`:`${m} min`;}
function weekCount(h,k){const ws=weekStartK(k);let c=0;for(let i=0;i<7;i++)if(isDone(h,addDays(ws,i)))c++;return c;}
// ¿Aparece en la lista de ese día?
function showOn(h,k){
  if(hasLog(h,k)||isExtra(h,k))return true;
  if(movedFrom(h,k))return true;
  if(isCancelledH(h,k))return false;
  if(hasDatePlan(h,k))return true;
  if(!isScheduled(h,k))return false;
  if(h.schedule.mode==='xweek'){
    if(isDone(h,k))return true;
    const ws=weekStartK(k);let other=0;
    for(let i=0;i<7;i++){const d=addDays(ws,i);if(d!==k&&isDone(h,d))other++;}

function momentFor(h,k){const t=habitTime(h,k);if(t&&t.start)return momentOfTime(t.start);const e=h.plan&&h.plan.program&&h.plan.program[k];return (e&&typeof e==='object'&&e.moment)||h.moment||'any';}
function dayHabits(k){return S.habits.filter(h=>!h.archived&&showOn(h,k));}
function dayStats(k){const hs=dayHabits(k);return{total:hs.length,done:hs.filter(h=>isDone(h,k)).length};}

function streaks(h){
  const t=todayK();
  if(h.schedule.mode==='xweek'){
    const times=h.schedule.times||1,tw=weekStartK(t);
    let ws=weekStartK(h.start),run=0,best=0;
    while(ws<=tw){
      if(weekCount(h,ws)>=times){run++;if(run>best)best=run;}
      else if(ws!==tw)run=0;
      ws=addDays(ws,7);
    }
    return{cur:run,best,unit:'sem'};
  }
  const first=Object.keys(S.logs).filter(d=>hasLog(h,d)).sort()[0];
  let k=first&&first<h.start?first:h.start,run=0,best=0,guard=0;
  while(k<=t&&guard++<4000){

function habitRate(h,days=30){
  const t=todayK();
  if(h.schedule.mode==='xweek'){
    const times=h.schedule.times||1;let got=0,need=0;
    let ws=weekStartK(addDays(t,-(days-1)));
    while(ws<=t){if(addDays(ws,6)>=h.start){need+=times;got+=Math.min(weekCount(h,ws),times);}ws=addDays(ws,7);}
    return need?got/need:null;
  }

  for(let i=0;i<days;i++){
    const k=addDays(t,-i);if(!showOnBase(h,k))continue;
    const d=isDone(h,k);if(k===t&&!d)continue;
    if(!d&&!missCounts(h,k)){if(weekMet(h,k)){due++;done++;}continue;}
    due++;if(d)done++;

function countDone(h){let c=0;for(const k in S.logs)if(S.logs[k][h.id]&&isDone(h,k))c++;return c;}

// Índice de rotación: el pasado avanza con cada vez que lo completas; el futuro, con cada día programado
function cycleIdx(h,k){
  const t=todayK();let c=0,d=h.start,guard=0;
  while(d<k&&guard++<4000){
    if(d<t){if(isDone(h,d))c++;}
    else if(d===t){if(isDone(h,d))c++;}
    else if(h.schedule.mode!=='xweek'&&isScheduled(h,d))c++;

  }

}
function planFor(h,k){
  const mf=movedFrom(h,k);
  if(mf&&mf!==k){const q=planFor(h,mf);return q?{text:q.text,tag:`↪ Movido desde el ${shortDate(mf)}${q.tag?' · '+q.tag:''}`}:{text:'',tag:`↪ Movido desde el ${shortDate(mf)}`};}
  const p=h.plan||{};
  if(p.dates&&p.dates[k])return{text:p.dates[k],tag:'Solo este día'};
  if(isExtra(h,k)&&!(p.program&&p.program[k])){
    const ks=p.program?Object.keys(p.program).filter(d=>d<k).sort():[];
    const last=ks.length?p.program[ks[ks.length-1]]:null;
    const txt=last?(typeof last==='string'?last:last.text||''):'';
    return{text:txt,tag:'➕ Sesión extra · cuenta para tu progreso'+(last&&last.tag?' · repite: '+last.tag:'')};
  }
  if(p.program&&p.program[k]){const e=p.program[k];if(typeof e==='string')return{text:e,tag:''};
    if(e.alt&&classCancelled(k))return{text:e.alt.text,tag:e.alt.tag};
    return{text:e.text||'',tag:e.tag||''};}
  if(p.mode==='weekly'){const t=(p.weekly||{})[dow(k)];return t?{text:t,tag:''}:null;}
  if(p.mode==='cycle'){

    const i=cycleIdx(h,k)%list.length;

  }

function schedText(h){
  const s=h.schedule;
  if(s.mode==='daily')return 'Cada día';
  if(s.mode==='weekdays'){
    const d=[...(s.days||[])].sort((a,b)=>WEEK_ORDER.indexOf(a)-WEEK_ORDER.indexOf(b));
    if(d.length===7)return 'Cada día';
    if(d.join()==='1,2,3,4,5')return 'Lunes a viernes';
    if(d.join()==='6,0')return 'Fines de semana';
    return d.map(x=>DOW_L[x]).join(' · ');
  }
  if(s.mode==='xweek')return `${s.times}× por semana`;
  if(s.mode==='everyN')return `Cada ${s.n} días`;
  if(s.mode==='dates'){
    const t=todayK(),ds=(s.dates||[]).filter(d=>d>=addDays(t,-14)&&d<=addDays(t,27));
    if(!ds.length)return (s.dates||[]).length?'Según el plan':'Sin fechas';

  if(h.type==='time')return `${h.target} min`;

  } else {
    for(const[m,label]of MOMENTS){
      const tt=h=>{const x=habitTime(h,k);return x&&x.start?tm(x.start):9999;};
      const g=hs.filter(h=>momentFor(h,k)===m).sort((a,b)=>tt(a)-tt(b));
      if(!g.length)continue;
      html+=`<div class="sec">${label}</div>`+g.map(h=>hcHTML(h,k)).join('');
    }
  }
  if(k<=addDays(t,7))html+=`<button class="btn ghost mt8" onclick="extraSheet('${k}')">➕ Añadir sesión extra</button>`;
  const cx=S.habits.filter(h=>!h.archived&&isCancelledH(h,k)&&!hasLog(h,k));
  if(cx.length){
    html+=`<div class="sec">Anulados o movidos</div>`+cx.map(h=>{const o=agOv(k,'h:'+h.id);return `<div class="cx">${esc(h.emoji)} <span>${esc(h.name)} · ${o.moveTo?`movido al ${shortDate(o.moveTo)}`:'anulado'}${o.reason?` (${esc(o.reason)})`:''}</span><button onclick="evRestore('${k}','h:${h.id}')">Restaurar</button></div>`;}).join('');
  }
  html+=`<div class="sec">Nota del día</div><div class="card note"><textarea id="noteIn" placeholder="Cómo ha ido, sensaciones, qué ajustar…" oninput="setNote(this.value)">${esc(S.notes[k]||'')}</textarea></div>`;
  body.innerHTML=html;
}

function metaText(h,k){
  const e=entry(h,k)||{},parts=[];
  const running=S.timer&&S.timer.hid===h.id&&S.timer.k===k;
  const ht=habitTime(h,k);if(ht&&ht.start)parts.push(`🕗 ${ht.start}–${fmtT(tm(ht.end))}`);
  if(h.type==='count')parts.push(`${fmtNum(e.v||0)} / ${h.target} ${esc(h.unit||'')}`.trim());
  if(h.type==='time')parts.push(running?`⏱ <span id="tm-${h.id}">${fmtClock((e.v||0)*60000+Date.now()-S.timer.t0)}</span> / ${h.target} min`:`${fmtMin(e.v||0)} / ${h.target} min`);
  if(h.type==='checklist')parts.push(`${h.steps.filter(s=>(e.steps||[]).includes(s.id)).length}/${h.steps.length} pasos`);
  if(h.schedule.mode==='xweek')parts.push(`${weekCount(h,k)}/${h.schedule.times} esta semana`);
  if(h.type==='check'&&!['xweek','dates'].includes(h.schedule.mode))parts.push(schedText(h));
  if(e.min)parts.push('🪫 mínima');
  if(e.mins!=null&&h.type!=='time')parts.push(`⏱ ${fmtDur(e.mins)}`);
  if(e.m&&Object.keys(e.m).length)parts.push('📈');
  const st=streaks(h);if(st.cur>0)parts.push(`🔥 ${st.cur}${st.unit==='sem'?' sem':''}`);
  return parts.join(' · ');
}

function hcHTML(h,k){
  const fut=k>todayK(),e=entry(h,k)||{},done=isDone(h,k),p=progress(h,k);
  const running=S.timer&&S.timer.hid===h.id&&S.timer.k===k;
  const dis=fut?'disabled':'';
  let ctl='';
  if(h.type==='check'){
    ctl=`<button class="ctl ${done?'full':''}" onclick="act('${h.id}')" ${dis} aria-label="Marcar">${done?'':ring(0,46,4,h.color)}<span class="ctl-in">${done?'✓':''}</span></button>`;
  } else if(h.type==='count'){
    ctl=`${(e.v||0)>0&&!fut?`<button class="mini" onclick="minus('${h.id}')" aria-label="Restar">−</button>`:''}<button class="ctl ${done?'full':''}" onclick="act('${h.id}')" ${dis} aria-label="Sumar">${done?'':ring(p,46,4,h.color)}<span class="ctl-in">${done?'✓':'+'}</span></button>`;
  } else if(h.type==='time'){
    const full=done&&!running;
    ctl=`<button class="ctl ${full?'full':''} ${running?'run':''}" onclick="act('${h.id}')" ${dis} aria-label="Cronómetro">${full?'':ring(p,46,4,h.color)}<span class="ctl-in">${running?'❚❚':full?'✓':'▶'}</span></button>`;
  } else {
    const c=h.steps.filter(s=>(e.steps||[]).includes(s.id)).length;
    ctl=`<button class="ctl ${done?'full':''}" onclick="act('${h.id}')" ${dis} aria-label="Completar todo">${done?'':ring(p,46,4,h.color)}<span class="ctl-in">${done?'✓':`${c}/${h.steps.length}`}</span></button>`;
  }
  const minOn=!!(S.minDays||{})[k]&&h.minimal&&!fut;
  const pl=minOn?{text:h.minimal,tag:'Versión mínima'}:planFor(h,k);
  const open=cardOpen(h,k,done);
  const plan=pl&&open?`<div class="hc-plan">${pl.tag?`<div class="pl-tag">${esc(pl.tag)}</div>`:''}${fmtPlan(pl.text)}</div>`:'';
  const minBtns=minOn&&!done?`<div class="hc-min"><button class="btn pri" onclick="doMin('${h.id}')">✓ Versión mínima hecha</button></div>`:'';
  const more=pl?`<button class="hc-more" onclick="toggleCard('${k}','${h.id}',${open?0:1})">${open?'Ocultar plan ▴':'Ver plan del día ▾'}</button>`:'';
  const steps=minOn||!open?'':h.type==='checklist'?`<div class="steps">${h.steps.map(s=>{const on=(e.steps||[]).includes(s.id);return `<button class="step ${on?'on':''}" onclick="stepT('${h.id}','${s.id}')" ${dis}><span class="sb">${on?'✓':''}</span>${esc(s.text)}</button>`;}).join('')}</div>`:'';
  return `<div class="hc ${done?'done':''}" id="hc-${h.id}" style="--hc:${h.color}">
    <div class="hc-row"><div class="hc-ico">${esc(h.emoji)}</div>
      <button class="hc-info" onclick="cardMenu('${h.id}')"><div class="hc-name">${esc(h.name)}</div><div class="hc-meta">${metaText(h,k)}</div></button>
      <div class="hc-ctl">${ctl}</div></div>${plan}${minBtns}${steps}${more}</div>`;
}
function linkLabel(u){
  if(/youtube\.com|youtu\.be/.test(u))return '▶ Buscar en YouTube';
  if(/google\.[a-z.]+\/search/.test(u))return '🔎 Buscar en Google';
  try{const x=new URL(u.replace(/&amp;/g,'&'));let p=(x.pathname+x.search).replace(/\/$/,'');if(p.length>28)p=p.slice(0,27)+'…';return '↗ '+x.hostname.replace(/^www\./,'')+p;}catch(e){return 'Abrir enlace ↗';}
}
function linkify(l){return l.replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${linkLabel(u)}</a>`);}
function fmtPlan(t){
  return esc(t).split('\n').map(l=>{
    const h=l.match(/^\s*#\s+(.*)/);
    if(h)return `<div class="pl-h">${linkify(h[1])}</div>`;
    const m=l.match(/^\s*[-•*]\s+(.*)/);
    if(m)return `<div class="pl-li">${linkify(m[1])}</div>`;
    return l.trim()?`<div>${linkify(l)}</div>`:'<div class="pl-gap"></div>';
  }).join('');
}

/* Acciones */
function ens(h,k){_wc=null;S.logs[k]=S.logs[k]||{};const e=S.logs[k][h.id]=S.logs[k][h.id]||{v:0,steps:[]};e.steps=e.steps||[];return e;}
function clean(h,k){
  const L=S.logs[k];if(!L)return;const e=L[h.id];
  if(e&&!e.v&&!e.min&&!(e.mins>0)&&!(e.steps&&e.steps.length)&&!(e.m&&Object.keys(e.m).length)&&!e.note)delete L[h.id];
  if(!Object.keys(L).length)delete S.logs[k];
}
function commit(h,k,was){
  clean(h,k);save();
  const now=isDone(h,k);
  const acts=[undoAct()];
  if(now&&!was&&isTrain(h))acts.push(['💪 RPE',()=>rpeSheet(h.id,k)]);
  else if(now&&!was&&h.id==='en'&&/simulacro/i.test(((planFor(h,k)||{}).tag||'')+((planFor(h,k)||{}).text||'').slice(0,120)))acts.push(['🎯 Nota',()=>mockSheet(k)]);
  else if(now&&!was&&(h.metrics||[]).length)acts.push(['📈 Registrar',()=>metricSheet(h.id,k)]);
  if(now&&!was){
    buzz();
    const st=dayStats(k);
    toast(st.total&&st.done===st.total?(k===todayK()?'¡Todo hecho hoy! 🔥':'¡Día completo! 🔥'):`✓ ${h.name}`,acts);
  } else toast(now?'Actualizado':was?`${h.name} desmarcado`:'Guardado',acts);
  render();
  if(now&&!was){const el=document.getElementById('hc-'+h.id);if(el){el.classList.add('pop');}}
}
function act(id,k=sel){ // k: el día del bloque o tarjeta que se ha tocado (por defecto, el seleccionado)
  const h=getH(id);if(!h)return;
  if(k>todayK())return toast('Ese día aún no ha llegado');
  pushUndo();
  if(h.type==='time'){if(k!==todayK())return valueSheet(id,k);return toggleTimer(h,k);}
  const was=isDone(h,k),e=ens(h,k);
  if(h.type==='check')e.v=e.v?0:1;
  else if(h.type==='count')e.v=r2((e.v||0)+(+h.step||1));
  else{const all=h.steps.every(s=>e.steps.includes(s.id));e.steps=all?[]:h.steps.map(s=>s.id);}
  commit(h,k,was);
}
function minus(id){
  const h=getH(id),k=sel;if(!h||k>todayK())return;pushUndo();
  const was=isDone(h,k),e=ens(h,k);e.v=Math.max(0,r2((e.v||0)-(+h.step||1)));commit(h,k,was);
}
function stepT(hid,sid){
  const h=getH(hid),k=sel;if(!h||k>todayK())return;pushUndo();
  const was=isDone(h,k),e=ens(h,k);
  e.steps=e.steps.includes(sid)?e.steps.filter(x=>x!==sid):[...e.steps,sid];
  commit(h,k,was);
}
function setNote(v){const k=sel;if(v.trim())S.notes[k]=v;else delete S.notes[k];clearTimeout(setNote._t);setNote._t=setTimeout(()=>{setNote._t=null;save();},400);}

/* Cronómetro */
function toggleTimer(h,k){
  const T=S.timer;
  if(T&&T.hid===h.id&&T.k===k)return stopTimer();
  if(T)stopTimer(true);
  S.timer={hid:h.id,k,t0:Date.now()};save();render();toast('⏱ Cronómetro en marcha');
}
function stopTimer(silent){
  const T=S.timer;if(!T)return;pushUndo();S.timer=null;
  const h=getH(T.hid);if(!h){save();return;}
  const add=(Date.now()-T.t0)/60000;
  const was=isDone(h,T.k),e=ens(h,T.k);e.v=r2((e.v||0)+add);
  if(!silent)toast(`+${fmtMin(add)} guardados`);
  commit(h,T.k,was);
}
setInterval(()=>{
  const T=S.timer,pill=$('#timerPill');
  if(!T){pill.classList.remove('on');return;}
  const h=getH(T.hid);if(!h)return;
  const ms=((entry(h,T.k)||{}).v||0)*60000+Date.now()-T.t0;
  if(!T.notified&&ms>=(h.target||0)*60000){T.notified=true;save();buzz();notify(`⏱ ${h.name}: objetivo de ${h.target} min cumplido`,'Puedes parar el cronómetro cuando quieras.');toast(`⏱ ${h.name}: ${h.target} min cumplidos 🎉`);}
  const el=document.getElementById('tm-'+T.hid);if(el&&view==='hoy')el.textContent=fmtClock(ms);
  pill.textContent=`⏱ ${h.emoji} ${h.name} · ${fmtClock(ms)}`;pill.classList.toggle('on',view!=='hoy');
},1000);

/* ═════════════ AGENDA ═════════════ */
const KIND={fijo:['Obligatorio','#F97316'],habito:['Hábito',null],comida:['Comida','#84CC16'],trayecto:['Trayecto','#64748B'],libre:['Tiempo libre','#55555F'],sueno:['Sueño','#6366F1'],rutina:['Rutina','#94A3B8']};
const KIND_COLOR={clase:'#60A5FA',futbol:'#F97316',partido:'#F97316',mimi:'#E879F9'};
let agView='day';
const AG0=6*60,AG1=24*60+40;
function evColor(e){if(e.kind==='habito'){const h=getH(e.habit);return h?h.color:'#22C55E';}return KIND_COLOR[e.id]||KIND[e.kind][1];}
function evIcon(e){if(e.kind==='habito'){const h=getH(e.habit);return h?h.emoji:'•';}return {clase:'🎓',futbol:'⚽',partido:'⚽',mimi:'🏃‍♀️',desayuno:'☕',comida:'🍽️',cena:'🍽️',merienda:'🍎',taper:'🥡',dormir:'😴'}[e.id]||{trayecto:'🚶',libre:'·',comida:'🍽️'}[e.kind]||'';}
function dayEvents(k){
  const out=[];
  for(const e of (S.agendaBase||{})[k]||[]){
    const o=agOv(k,e.id);if(o&&o.moveTo)continue;
    const ev={...e,date:k};
    if(o){if(o.cancel){ev.cancelled=true;ev.reason=o.reason||'';}if(o.start){ev.start=o.start;ev.end=o.end;ev.edited=true;}}
    if(e.id==='h:fuerza'&&classCancelled(k)){const hp=getH('fuerza'),pe=hp&&hp.plan&&hp.plan.program&&hp.plan.program[k];if(pe&&pe.alt)ev.title='Fuerza / calistenia · sesión completa (sin clase)';}
    out.push(ev);
  }
  const ag=(S.agenda||{})[k]||{};
  for(const id in ag){
    if(!id.startsWith('in:'))continue;
    const o=ag[id],hid=id.slice(3),h=getH(hid);if(!h)continue;
    const src=(o.from&&baseEvent(o.from,'h:'+hid))||{id:'h:'+hid,title:h.name,kind:'habito',habit:hid};
    out.push(o.extra?{...src,id:'h:'+hid,date:k,start:o.start,end:o.end,extra:true,title:h.name+' · extra'}:{...src,id:'h:'+hid,date:k,start:o.start,end:o.end,moved:o.from});
  }
  return out.filter(e=>e.start).sort((a,b)=>tm(a.start)-tm(b.start)||tm(a.end)-tm(b.end));
}
function layout(evs){ // reparte en columnas los bloques que se solapan
  const res=[];let cluster=[],cEnd=-1;
  const flush=()=>{const lanes=[];for(const e of cluster){let i=lanes.findIndex(end=>end<=tm(e.start));if(i<0){i=lanes.length;lanes.push(0);}lanes[i]=tm(e.end);e._lane=i;}for(const e of cluster)e._lanes=lanes.length;res.push(...cluster);cluster=[];};
  for(const e of evs){if(cluster.length&&tm(e.start)>=cEnd){flush();cEnd=-1;}cluster.push(e);cEnd=Math.max(cEnd,tm(e.end));}
  flush();return res;
}
function renderAgenda(){
  const k=sel,t=todayK();
  $('#agTitle').textContent=k===t?'Agenda · hoy':'Agenda';
  $('#agSub').textContent=longDate(k);
  renderWeek('#agWeek');
  const body=$('#agBody');
  const seg=`<div class="ag-bar"><div class="seg">${[['day','Día'],['3','3 días'],['week','Semana']].map(([v,l])=>`<button class="${agView===v?'on':''}" onclick="agView='${v}';renderAgenda()">${l}</button>`).join('')}</div></div>`;
  const legend=`<div class="ag-legend"><span><i style="background:#F97316"></i>Obligatorio</span><span><i style="background:#60A5FA"></i>Clase</span><span><i style="background:#22C55E"></i>Hábitos (su color)</span><span><i style="background:#84CC16"></i>Comidas</span><span><i style="background:#64748B"></i>Trayectos</span><span><i style="border:1px dashed var(--dim)"></i>Libre</span></div>`;
  const evs=dayEvents(k);
  if(!evs.length&&agView==='day'){
    const until=S.agendaUntil;
    body.innerHTML=seg+`<div class="card empty"><div class="big">🗓️</div><h3>Sin agenda para este día</h3><p>${until&&k>until?`La agenda está hecha hasta el ${shortDate(until)}. Pásame el horario del 2.º cuatrimestre y la alargo.`:'Todavía no hay agenda cargada. Se carga sola con el plan.'}</p></div>`;
    return;
  }
  if(agView==='week'||agView==='3'){body.innerHTML=seg+legend+classesNote(k)+weekGrid(agView==='3'?3:7);return;}
  const PX=1.1,H=(AG1-AG0)*PX;
  let html=`<div class="ag-day" style="height:${H+10}px">`;

function edType(v){
  D.type=v;
  if(v==='checklist'&&!D.steps.length)D.steps=[{id:uid(),text:''},{id:uid(),text:''}];
  if(v==='time'&&(!D.target||D.target<5))D.target=30;
  if(v==='count'&&(!D.target||D.target<1))D.target=1;
  edR();
}
function edMoment(v){D.moment=v;edR();}
function edSched(v){D.schedule.mode=v;edR();}
function edPlan(v){D.plan.mode=v;edR();}
function edDay(d){const a=D.schedule.days;D.schedule.days=a.includes(d)?a.filter(x=>x!==d):[...a,d];edR();}
function edAddDate(){const v=$('#edDateIn').value;if(!v)return;if(!D.schedule.dates.includes(v))D.schedule.dates.push(v);edR();}
function edDelDate(k){D.schedule.dates=D.schedule.dates.filter(x=>x!==k);edR();}
function edSave(){
  D.name=(D.name||'').trim();
  if(!D.name)return toast('Ponle un nombre');
  if(!D.emoji)D.emoji='•';
  if(D.type==='count'||D.type==='time'){if(!(D.target>0))return toast('El objetivo tiene que ser mayor que 0');}
  else D.target=1;
  if(D.type==='count'&&!(D.step>0))D.step=1;
  if(D.type==='checklist'){D.steps=D.steps.filter(s=>s.text.trim());if(!D.steps.length)return toast('Añade al menos un paso');}
  const s=D.schedule;
  if(s.mode==='weekdays'&&!s.days.length)return toast('Elige al menos un día');
  if(s.mode==='dates'&&!s.dates.length)return toast('Añade al menos una fecha');
  if(s.mode==='everyN'&&!(s.n>=1))s.n=2;
  // limpiar plan
  const p=D.plan;
  for(const d in p.weekly)if(!String(p.weekly[d]).trim())delete p.weekly[d];
  if(p.mode==='cycle'&&!p.cycle.some(c=>c.trim()))p.mode='none';
  const isNew=D._new;delete D._new;
  if(!isNew&&S.packs&&Object.keys(S.packs).length)D.userEdited=true; // la próxima actualización del plan respeta tus cambios
  if(isNew)S.habits.push(D);else{const i=S.habits.findIndex(h=>h.id===D.id);S.habits[i]=D;}
  D=null;save();closeSheet();render();toast(isNew?'Hábito creado ✨':'Cambios guardados');
}

/* ═════════════ ESTADÍSTICAS ═════════════ */
function renderStats(){
  const t=todayK(),hs=S.habits.filter(h=>!h.archived);
  if(!hs.length){$('#statsBody').innerHTML=`<div class="card empty"><div class="big">📊</div><h3>Sin datos todavía</h3><p>Cuando tengas hábitos y empieces a marcarlos, aquí verás tu evolución.</p></div>`;return;}
  const agg=(from,to)=>{let d=0,n=0;for(let k=from;k<=to;k=addDays(k,1)){const s=dayStats(k);d+=s.done;n+=s.total;}return n?d/n:null;};
  const today=dayStats(t);
  const r7=agg(addDays(t,-7),addDays(t,-1)),r30=agg(addDays(t,-30),addDays(t,-1));
  let bestS=null;for(const h of hs){const st=streaks(h);if(!bestS||st.cur>bestS.cur)bestS={...st,h};}
  const pct=v=>v===null?'—':Math.round(v*100)+'%';

  const first=hs.map(h=>h.start).sort()[0];
  const nW=Math.min(12,weeksSince(first,12,1));
  // Barras: desde la primera semana con hábitos (máx. 12)
  const tw=weekStartK(t);let bars='';
  for(let i=nW-1;i>=0;i--){
    const ws=addDays(tw,-7*i);let d=0,n=0;
    for(let j=0;j<7;j++){const k=addDays(ws,j);if(k>t)break;const s=dayStats(k);d+=s.done;n+=s.total;}
    const v=n?d/n:0;
    bars+=`<div class="bar"><em>${n?Math.round(v*100):''}</em><i class="${i===0?'cur':''}" style="height:${Math.max(2,v*100)}%"></i><span>${shortDate(ws).split(' ')[0]}/${pk(ws).getMonth()+1}</span></div>`;
  }

  // Mapa de calor global desde el inicio
  const W=weeksSince(first,26,10),start=addDays(tw,-7*(W-1));let cells='';
  const acc=S.settings.accent||'#22C55E';
  for(let d=0;d<7;d++)for(let w=0;w<W;w++){
    const k=addDays(start,7*w+d);let bg='transparent';
    if(k<=t){const s=dayStats(k);if(!s.total)bg='#18181E';else{const v=s.done/s.total;bg=v===0?'#24242C':v<.34?acc+'55':v<.67?acc+'99':v<1?acc+'CC':acc;}}
    cells+=`<i style="background:${bg}"></i>`;
  }

  const rows=hs.map(h=>({h,r:habitRate(h,30),st:streaks(h)})).sort((a,b)=>(b.r??-1)-(a.r??-1));

  $('#statsBody').innerHTML=`
    <div class="kpis">
      <div class="kpi"><b>${today.done}/${today.total}</b><span>Hoy</span></div>
      <div class="kpi"><b>${pct(r7)}</b><span>Últimos 7 días</span></div>
      <div class="kpi"><b>${pct(r30)}</b><span>Últimos 30 días</span></div>
      <div class="kpi"><b>${bestS&&bestS.cur?`🔥 ${bestS.cur}`:'—'}</b><span>${bestS&&bestS.cur?esc(bestS.h.emoji+' '+bestS.h.name):'Mejor racha actual'}</span></div>
    </div>
    <button class="banner" onclick="reviewSheet()">🗓️<div><b>Revisión de la semana</b><small>Qué ha ido bien, qué falló y qué viene</small></div><span class="go">Abrir ›</span></button>
    <div class="sec">Cumplimiento por semana</div>
    <div class="card"><div class="bars">${bars}</div></div>
    ${loadBlock()}
    ${mocksBlock()}
    ${energyBlock()}
    <div class="sec">Todos los hábitos · desde el inicio</div>
    <div class="card"><div class="hm" style="grid-template-columns:repeat(${W},1fr)">${cells}</div></div>
    <div class="sec">Ranking · 30 días</div>
    <div class="card">${rows.map(({h,r,st})=>`<div class="rk" style="--hc:${h.color}"><span class="hc-ico sm">${esc(h.emoji)}</span>
      <div class="rk-n"><div>${esc(h.name)}${st.cur?` <span style="color:var(--muted);font-weight:500">· 🔥 ${st.cur}${st.unit==='sem'?' sem':''}</span>`:''}</div><div class="rk-bar"><i style="width:${r===null?0:r*100}%"></i></div></div>
      <span class="rk-p">${pct(r)}</span></div>`).join('')}</div>`;
}

function importData(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d&&d.kind==='rutina-plan'){
        ask(`¿Cargar el plan (${d.habits.length} hábito${d.habits.length===1?'':'s'})? Tus registros se conservan.`,'Cargar plan').then(async ok=>{if(!ok)return;await safetySnap('Antes de cargar un plan');mergePack(d);go('hoy');toast('📥 Plan cargado');});return;
      }
      if(!d||!Array.isArray(d.habits)||typeof d.logs!=='object')return toast('❌ Archivo no válido');
      ask(`Se importarán ${d.habits.length} hábitos y sustituirán los actuales. Antes guardo una copia automática de lo que tienes.`,'Importar',true).then(async ok=>{if(!ok)return;
        await safetySnap('Antes de importar una copia');dropUndo();
        delete d.exportedAt;S=migrate(Object.assign(JSON.parse(JSON.stringify(DEF)),d,{schema:d.schema||1}));save();savePlan();applyAccent();sel=todayK();go('hoy');toast('Datos restaurados ✅');});
    }catch(err){toast('❌ No se pudo leer el archivo');}
  };
  rd.readAsText(f);input.value='';
}

/* Planes (plan.json) */
function mergePack(pack){
  if(!pack||pack.kind!=='rutina-plan'||!Array.isArray(pack.habits))return false;
  const base=blankHabit();
  for(const ph of pack.habits){
    const ex=getH(ph.id);
    if(ex){
      const keepDates=(ex.plan&&ex.plan.dates)||{},keepArch=ex.archived;
      const mine=ex.userEdited?{name:ex.name,emoji:ex.emoji,color:ex.color,desc:ex.desc,moment:ex.moment,target:ex.target,unit:ex.unit,steps:ex.steps,userEdited:true}:{};
      Object.assign(ex,ph,mine);
      ex.plan=Object.assign({},base.plan,ph.plan||{});ex.plan.dates=keepDates;ex.archived=keepArch;
    } else {
      const h=Object.assign(blankHabit(),ph);
      h.plan=Object.assign({},base.plan,ph.plan||{});h.plan.dates=h.plan.dates||{};
      h.schedule=Object.assign({},base.schedule,ph.schedule||{});
      S.habits.push(h);
    }
  }
  if(pack.agenda){S.agendaBase=pack.agenda;S.agendaUntil=pack.agendaUntil||'';S.classesKnownUntil=pack.classesKnownUntil||'';}
  S.packs=S.packs||{};S.packs[pack.id||'plan']=pack.version||1;
  save();savePlan();return true;
}
async function autoPlan(){
  if(!location.protocol.startsWith('http'))return;
  try{
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),10000);
    const r=await fetch('plan.json',{cache:'no-store',signal:ac.signal});clearTimeout(to);if(!r.ok)return;
    const p=await r.json();if(!p||p.kind!=='rutina-plan')return;
    const cur=((S.packs||{})[p.id||'plan'])||0;
    if((p.version||1)>cur){if(cur)await safetySnap('Antes de actualizar el plan');mergePack(p);render();toast(cur?'📥 Plan actualizado':'📥 Plan cargado');}
  }catch(e){}
}

function nowCard(k){
  const evs=dayEvents(k).filter(e=>!e.cancelled);if(!evs.length)return '';
  const n=new Date(),m=n.getHours()*60+n.getMinutes();
  const cur=evs.find(e=>tm(e.start)<=m&&m<tm(e.end));
  const nxt=evs.find(e=>tm(e.start)>m&&!['libre','trayecto','sueno'].includes(e.kind));
  if(!cur&&!nxt)return '';
  const row=(e,lb,cls,extra)=>`<button class="now-row ${cls}" onclick="evSheet('${k}','${e.id}')"><span class="lb">${lb}</span><div class="tx"><b>${evIcon(e)} ${esc(e.title)}</b><small>${fmtT(tm(e.start))}–${fmtT(tm(e.end))} · ${extra}</small></div></button>`;
  const left=x=>{const d=x;return d>=60?`${Math.floor(d/60)} h ${pad(d%60)} min`:`${d} min`;};
  return `<div class="now-card">${cur?row(cur,'AHORA','',`quedan ${left(tm(cur.end)-m)}`):''}${nxt?row(nxt,'DESPUÉS','next',`en ${left(tm(nxt.start)-m)}`):''}</div>`;
}

function metricSeries(h,id){return Object.keys(S.logs).sort().map(k=>{const e=S.logs[k][h.id];return e&&e.m&&e.m[id]!=null?{k,v:e.m[id]}:null;}).filter(Boolean);}
function spark(vals,color){if(vals.length<2)return '';const w=90,hh=28,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(hh-2-(v-mn)/r*(hh-4)).toFixed(1)}`).join(' ');

function metricsBlock(h){

function weekSummary(ws){
  const days=[...Array(7)].map((_,i)=>addDays(ws,i)).filter(k=>k<=todayK());
  const hs=S.habits.filter(h=>!h.archived);let D=0,N=0;const per=[],miss=[],canc=[];let mins=0;
  for(const h of hs){let d=0,n=0,mn=0;for(const k of days){if(isCancelledH(h,k)){const o=agOv(k,'h:'+h.id);canc.push(`${h.emoji} ${h.name} · ${shortDate(k)}${o&&o.moveTo?` (movido al ${shortDate(o.moveTo)})`:''}`);continue;}
    if(!showOnBase(h,k))continue;n++;if(isDone(h,k)){d++;if((entry(h,k)||{}).min)mn++;}else if(k<todayK()&&!weekMet(h,k))miss.push(`${h.emoji} ${h.name} · ${DOW_N[dow(k)].toLowerCase()} ${shortDate(k)}`);}
    const g=weekGoal(h,ws),wm=weekMins(h,ws);
    if(n||wm){per.push({h,d,n,mn,g,wm});D+=d;N+=n;mins+=mn;}}
  const metr=[];for(const h of hs)for(const x of h.metrics||[]){const vals=days.map(k=>{const e=entry(h,k);return e&&e.m&&e.m[x.id]!=null?e.m[x.id]:null;}).filter(v=>v!=null);if(vals.length)metr.push(`${h.emoji} ${x.label}: ${vals.map(fmtNum).join(' → ')} ${x.unit||''}`);}
  const nws=addDays(ws,7),next=[];for(let i=0;i<7;i++){const k=addDays(nws,i);for(const e of dayEvents(k))if(e.id==='clase'||/examen|prueba|parcial|presentaci/i.test(e.title))next.push(`${DOW_N[dow(k)].slice(0,3)} ${shortDate(k)} · ${e.title} (${fmtT(tm(e.start))})`);}
  for(const h of hs){const pr=h.plan&&h.plan.program;if(!pr)continue;for(let i=0;i<7;i++){const k=addDays(nws,i),x=pr[k];if(x&&typeof x==='object'&&/Simulacro|examen|Matric/i.test((x.tag||'')+(x.text||'').slice(0,80)))next.push(`${DOW_N[dow(k)].slice(0,3)} ${shortDate(k)} · ${h.emoji} ${x.tag||h.name}`);}}
  return{ws,days,D,N,per,miss,canc,mins,metr,next:[...new Set(next)]};
}
function reviewText(r){
  const pct=r.N?Math.round(r.D/r.N*100):0;
  return [`Revisión semanal Rutina · semana del ${shortDate(r.ws)}`,`Cumplimiento: ${r.D}/${r.N} (${pct}%)${r.mins?` · ${r.mins} en versión mínima`:''}`,
    ...r.per.map(p=>`- ${p.h.emoji} ${p.h.name}: ${p.d}/${p.n} sesiones · ${fmtDur(p.wm)} de ${fmtDur(p.g)}${p.g&&p.wm>=p.g?' ✓':''}${p.mn?` (${p.mn} mínimas)`:''}`),
    r.miss.length?`Fallados: ${r.miss.join('; ')}`:'Fallados: ninguno',
    r.canc.length?`Anulados/movidos: ${r.canc.join('; ')}`:'',
    r.metr.length?`Progreso: ${r.metr.join('; ')}`:'',
    r.next.length?`La semana que viene: ${r.next.join('; ')}`:'',
    (()=>{const a=acwr(addDays(r.ws,6)),L=loadRange(r.ws,addDays(r.ws,6)).L;return L?`Carga de entreno: ${Math.round(L)} (RPE×min)${a.enough&&a.r?` · ACWR ${a.r.toFixed(2)} (${acwrZone(a.r)[0]})`:''}`:''})(),
    (()=>{const c=r.days.map(k=>(S.checkins||{})[k]).filter(Boolean);if(!c.length)return '';const av=f=>{const v=c.map(x=>x[f]).filter(Boolean);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'—';};return `Sueño medio ${av('sleep')}/5 · energía media ${av('energy')}/5`;})(),
    (()=>{const m=(S.mocks||[]).filter(m=>m.date>=r.ws&&m.date<=addDays(r.ws,6));return m.length?'Simulacros B2: '+m.map(x=>{const q=mockScore(x);return `${shortDate(x.date)} ${q.overall} (${Object.entries(q.sc).map(([p,v])=>B2T[p].n+' '+(v??'<122')).join(', ')})`;}).join('; '):''})(),
    'Notas: '+r.days.map(k=>S.notes[k]?`${shortDate(k)}: ${S.notes[k]}`:'').filter(Boolean).join(' | ')].filter(Boolean).join('\n');
}

function icsEsc(t){return String(t||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m);}
function icsSheet(){
  const t=todayK(),until=S.agendaUntil||addDays(t,28);
  openSheet(`<div class="sheet-title">🔔 Avisos en tu calendario</div>
    <p class="hint">Se crea un archivo de calendario con tus tareas importantes (hábitos, clases, fútbol, partido) y un aviso 5 minutos antes. Ábrelo y añádelo a Google Calendar o al Calendario de Apple: te avisará aunque la app esté cerrada.</p>
    <p class="hint">Si cambias la agenda (anular, mover…), vuelve a exportarlo. Te recomiendo exportar 2–4 semanas cada vez.</p>
    <div class="two" style="margin-top:10px"><div><label class="lbl" style="margin-top:0">Desde</label><input type="date" id="icF" value="${t}"></div><div><label class="lbl" style="margin-top:0">Hasta</label><input type="date" id="icT" value="${addDays(t,13)<until?addDays(t,13):until}"></div></div>
    <label class="chk"><input type="checkbox" id="icM"> Incluir comidas y cenas</label>
    <div class="btns"><button class="btn pri" onclick="exportICS()">Crear y abrir</button></div>`);
}
function buildICS(f,to,meals,descLen=600){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rutina//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:Rutina'];let n=0;
  const dt=(k,hm)=>{let m=tm(hm),kk=k;if(m>=1440){m-=1440;kk=addDays(k,1);}return kk.replace(/-/g,'')+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';};
  for(let k=f;k<=to;k=addDays(k,1))for(const e of dayEvents(k)){
    if(e.cancelled)continue;if(!(e.kind==='habito'||e.kind==='fijo'||(meals&&(e.id==='comida'||e.id==='cena'))))continue;
    const h=e.habit?getH(e.habit):null,pl=h?planFor(h,k):null;
    const desc=pl&&pl.text?pl.text.slice(0,descLen):(e.detail||'');
    L.push('BEGIN:VEVENT',`UID:${k}-${e.id.replace(':','-')}@rutina`,`DTSTAMP:${todayK().replace(/-/g,'')}T000000Z`,`DTSTART:${dt(k,e.start)}`,`DTEND:${dt(k,e.end)}`,
      `SUMMARY:${icsEsc((h?h.emoji+' ':'')+e.title)}`,`DESCRIPTION:${icsEsc(desc)}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(e.title)}`,'TRIGGER:-PT5M','END:VALARM','END:VEVENT');n++;}
  L.push('END:VCALENDAR');return{text:L.join('\r\n'),n};
}
async function exportICS(){
  const f=$('#icF').value,to=$('#icT').value,meals=$('#icM').checked;if(!f||!to||to<f)return toast('Revisa las fechas');
  const{text,n}=buildICS(f,to,meals);if(!n)return toast('No hay tareas en esas fechas');
  await shareFile(`rutina-${f}_a_${to}.ics`,text,'text/calendar','Agenda de Rutina');closeSheet();toast(`${n} tareas exportadas 🔔`);
}

const _notified=new Set();
function checkNotify(m){
  if(!S.settings.notif)return;const k=todayK();
  for(const e of dayEvents(k)){if(e.cancelled||!(e.kind==='habito'||e.kind==='fijo'))continue;
    const st=tm(e.start),key=k+e.id;if(st-5<=m&&m<st&&!_notified.has(key)){_notified.add(key);notify(`${evIcon(e)} ${e.title} a las ${fmtT(st)}`,'Empieza en 5 minutos');}}
  if(m>=22*60&&m<22*60+5&&!_notified.has(k+'manana')){_notified.add(k+'manana');const tm_=tomorrowInfo();if(tm_)notify('🌙 Mañana',tm_.text);}

/* ═════════════ ARRASTRAR BLOQUES ═════════════
   Móvil: mantener pulsado 0,35 s y arrastrar (así no se confunde con hacer scroll). Ordenador: arrastrar con el ratón.
   Encaja cada 15 min; al soltar guarda la hora nueva igual que el cambio manual (con Deshacer). */
function dragAttrs(k,e,px,lo,hi){
  if(e.cancelled||['libre','sueno'].includes(e.kind))return '';
  return ` data-drag="1" data-k="${k}" data-id="${e.id}" data-px="${px}" data-lo="${lo}" data-hi="${hi}" data-s="${tm(e.start)}" data-e="${tm(e.end)}"`;
}
const DRAG={el:null,timer:null,on:false,y0:0,x0:0,top0:0,d:0,tip:null,eatClick:false};
const SNAP=15;
function dragStart(el,x,y,instant){
  DRAG.el=el;DRAG.x0=x;DRAG.y0=y;DRAG.d=0;DRAG.on=false;DRAG.top0=parseFloat(el.style.top);
  clearTimeout(DRAG.timer);
  if(!instant)DRAG.timer=setTimeout(()=>dragActivate(),350);
}
function dragActivate(){
  const el=DRAG.el;if(!el)return;DRAG.on=true;
  const grid=el.closest('.agw');DRAG.cols=grid?[...grid.querySelectorAll('.agw-day')]:[];DRAG.toK=el.dataset.k;el.classList.add('dragging');document.body.classList.add('drag-on');
  if(navigator.vibrate)navigator.vibrate(15);
  DRAG.tip=document.createElement('div');DRAG.tip.className='drag-tip';document.body.appendChild(DRAG.tip);dragShow(DRAG.y0,DRAG.x0);
}
function dragNewTimes(el=DRAG.el){
  const px=+el.dataset.px,s=+el.dataset.s,e=+el.dataset.e,lo=+el.dataset.lo,hi=+el.dataset.hi,dur=e-s;
  let ns=Math.round((s+DRAG.d/px)/SNAP)*SNAP;ns=Math.max(lo,Math.min(hi-dur,ns));return[ns,ns+dur];
}
function dragShow(y,x){
  const el=DRAG.el,px=+el.dataset.px,[ns,ne]=dragNewTimes();
  el.style.top=(DRAG.top0+(ns-+el.dataset.s)*px)+'px';
  // Cambiar de día (solo hábitos, en Semana / 3 días)
  if(DRAG.cols&&DRAG.cols.length>1&&el.dataset.id.startsWith('h:')&&x!=null){
    const own=DRAG.cols.find(c=>c.dataset.colk===el.dataset.k),r0=own.getBoundingClientRect();
    let tgt=DRAG.cols.find(c=>{const r=c.getBoundingClientRect();return x>=r.left&&x<r.right;})||(x<r0.left?DRAG.cols[0]:x>=r0.right?DRAG.cols[DRAG.cols.length-1]:own);
    DRAG.toK=tgt.dataset.colk;el.style.transform=`translateX(${tgt.getBoundingClientRect().left-r0.left}px)`;
  }
  const dl=DRAG.toK&&DRAG.toK!==el.dataset.k?`${DOW_N[dow(DRAG.toK)].slice(0,3).toLowerCase()} ${+DRAG.toK.slice(8)} · `:'';
  const sm=el.querySelector('small');if(sm)sm.textContent=`${fmtT(ns)}–${fmtT(ne)}`;
  if(DRAG.tip){DRAG.tip.textContent=`${dl}${fmtT(ns)}–${fmtT(ne)}`;DRAG.tip.style.left=x+'px';DRAG.tip.style.top=y+'px';}
}
function dragMove(x,y,ev){
  if(!DRAG.el)return;
  if(!DRAG.on){
    if(Math.hypot(x-DRAG.x0,y-DRAG.y0)>8){
      if(ev.type==='mousemove')dragActivate();      // ratón: arrastrar directamente
      else{clearTimeout(DRAG.timer);DRAG.el=null;return;} // dedo antes de tiempo: es scroll
    }else return;
  }
  if(ev.cancelable)ev.preventDefault();
  DRAG.d=y-DRAG.y0;dragShow(y,x);
}
function dragEnd(){
  clearTimeout(DRAG.timer);const el=DRAG.el;DRAG.el=null;
  if(DRAG.tip){DRAG.tip.remove();DRAG.tip=null;}
  document.body.classList.remove('drag-on');
  if(!el||!DRAG.on)return;
  DRAG.on=false;DRAG.eatClick=true;setTimeout(()=>DRAG.eatClick=false,400);
  el.classList.remove('dragging');
  const[ns,ne]=dragNewTimes(el),toK=DRAG.toK||el.dataset.k;DRAG.toK=null;DRAG.cols=null;
  if(toK!==el.dataset.k)return dragToDay(el.dataset.k,el.dataset.id.slice(2),toK,fmtT(ns),fmtT(ne));
  if(ns===+el.dataset.s){render();return;}
  setEvTime(el.dataset.k,el.dataset.id,fmtT(ns),fmtT(ne));
}
document.addEventListener('touchstart',e=>{const el=e.target.closest('[data-drag]');if(el&&e.touches.length===1)dragStart(el,e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
document.addEventListener('touchmove',e=>{if(DRAG.el)dragMove(e.touches[0].clientX,e.touches[0].clientY,e);},{passive:false});
document.addEventListener('touchend',dragEnd,{passive:true});
document.addEventListener('touchcancel',()=>{if(DRAG.on){DRAG.d=0;}dragEnd();},{passive:true});
document.addEventListener('mousedown',e=>{if(e.button!==0)return;const el=e.target.closest('[data-drag]');if(el){dragStart(el,e.clientX,e.clientY,true);e.preventDefault();}});
document.addEventListener('mousemove',e=>{if(DRAG.el)dragMove(e.clientX,e.clientY,e);});
document.addEventListener('mouseup',dragEnd);
document.addEventListener('click',e=>{if(DRAG.eatClick&&e.target.closest('[data-drag]')){e.stopPropagation();e.preventDefault();DRAG.eatClick=false;}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-drag]'))e.preventDefault();});

/* ═════════════ MOVER DE DÍA ARRASTRANDO ═════════════ */
function dragToDay(k,hid,to,s,e){
  const h=getH(hid);if(!h)return render();
  if(isDone(h,k)){render();return toast(`${h.name} ya está hecho ese día: no se mueve`);}
  if(showOn(h,to)){render();return toast(`El ${shortDate(to)} ya tienes ${h.name}`);}
  pushUndo();
  const mi=agOv(k,'in:'+hid);
  if(mi&&mi.extra){agSet(k,'in:'+hid,null);agSet(to,'in:'+hid,{extra:true,start:s,end:e});}
  else if(mi&&mi.from){agSet(k,'in:'+hid,null);
    if(to===mi.from){agSet(mi.from,'h:'+hid,null);const b=baseEvent(to,'h:'+hid);if(!(b&&b.start===s))agSet(to,'h:'+hid,{start:s,end:e});}
    else{agSet(mi.from,'h:'+hid,{moveTo:to});agSet(to,'in:'+hid,{from:mi.from,start:s,end:e});}}
  else{agSet(k,'h:'+hid,{moveTo:to});agSet(to,'in:'+hid,{from:k,start:s,end:e});}
  if(S.timer&&S.timer.hid===hid&&S.timer.k===k)S.timer=null;
  const ov=overlaps(to,'h:'+hid,tm(s),tm(e));
  afterAg(`${h.emoji} ${h.name} → ${DOW_N[dow(to)].toLowerCase()} ${shortDate(to)} a las ${s}${ov.length?` · se solapa con ${ov[0]}`:''}`);
}

/* ═════════════ RESUMEN DE MAÑANA ═════════════ */
function tomorrowInfo(){
  const t=todayK(),tk=addDays(t,1);
  const evs=dayEvents(tk).filter(e=>!e.cancelled&&(e.kind==='habito'||e.kind==='fijo'));
  const bed=dayEvents(t).find(e=>e.kind==='sueno'&&!e.cancelled&&tm(e.start)>=18*60);
  const wake=bed?fmtT((tm(bed.start)+8*60)%1440):null;
  if(!evs.length&&!wake)return null;
  const first=evs[0];
  return{tk,evs,bed:bed?fmtT(tm(bed.start)):null,wake,text:`${bed?`Acuéstate a las ${fmtT(tm(bed.start))} y levántate a las ${wake}. `:''}${first?`Empiezas con ${first.title} a las ${fmtT(tm(first.start))}`:''}${evs.length>1?` · ${evs.length} tareas`:''}`};
}
function tomorrowCard(){
  if(new Date().getHours()<20)return '';const i=tomorrowInfo();if(!i)return '';

/* ═════════════ CARGA DE ENTRENO (RPE × min, ACWR) ═════════════ */
function isTrain(h){return (h.metrics||[]).some(m=>m.id==='rpe');}
function sessLoad(h,k){if(!isDone(h,k))return null;const e=entry(h,k)||{},r=e.m&&e.m.rpe!=null?+e.m.rpe:null,mins=minsOf(h,k);return{load:(r??6)*mins,est:r==null,rpe:r,mins};}
function dayLoad(k){let L=0,est=0;for(const h of S.habits)if(!h.archived&&isTrain(h)){const x=sessLoad(h,k);if(x){L+=x.load;if(x.est)est++;}}return{L,est};}
function loadRange(a,b){let L=0,est=0;for(let k=a;k<=b;k=addDays(k,1)){const d=dayLoad(k);L+=d.L;est+=d.est;}return{L,est};}
function acwr(k=todayK()){
  const a=loadRange(addDays(k,-6),k).L,c=loadRange(addDays(k,-27),k).L/4;
  let first=null;for(const d of Object.keys(S.logs).sort()){if(S.habits.some(h=>isTrain(h)&&isDone(h,d))){first=d;break;}}
  return{a,c,r:c>0?a/c:null,enough:!!first&&diffDays(first,k)>=21};
}
function acwrZone(r){if(r==null)return['Sin datos','var(--muted)',''];if(r<0.8)return['Baja','#60A5FA','Entrenas menos de lo habitual: puedes apretar un poco.'];if(r<=1.3)return['Óptima','#22C55E','Zona segura: progresas sin riesgo.'];if(r<=1.5)return['Ojo','#FBBF24','Has subido rápido: no añadas más esta semana.'];return['Riesgo','#F87171','Pico de carga: baja intensidad o volumen unos días.'];}
function loadBlock(){
  if(!S.habits.some(h=>!h.archived&&isTrain(h)))return '';
  const t=todayK(),aw=acwr(t),[zn,zc,zt]=acwrZone(aw.enough?aw.r:null),tw=weekStartK(t);
  const weeks=[...Array(8)].map((_,i)=>{const ws=addDays(tw,-7*(7-i));return{ws,...loadRange(ws,addDays(ws,6))};});
  const mx=Math.max(1,...weeks.map(w=>w.L)),H=56,est=loadRange(addDays(t,-27),t).est;
  return `<div class="sec">Carga de entreno</div><div class="card">
    <div class="acwr"><b>${aw.enough&&aw.r!=null?aw.r.toFixed(2):'—'}</b><div style="flex:1"><span class="zone" style="background:color-mix(in srgb,${zc} 20%,transparent);color:${zc}">${aw.enough?zn:'Faltan datos'}</span><p class="hint" style="margin:4px 0 0">${aw.enough?zt:'Necesito 3 semanas de entrenos para calcular el ratio con fiabilidad.'}</p></div></div>
    <p class="hint">Ratio agudo:crónico = carga de los últimos 7 días ÷ media semanal de las últimas 4. Esta semana: ${Math.round(aw.a)} · media: ${Math.round(aw.c)} (RPE × minutos).</p>
    <div class="wk-hist">${weeks.map(w=>`<div title="${Math.round(w.L)}"><i style="height:${Math.max(2,Math.round(w.L/mx*H))}px;background:var(--acc)"></i><span>${shortDate(w.ws).split(' ')[0]}</span></div>`).join('')}</div>
    ${est?`<p class="hint" style="margin:8px 0 0">${est} sesión${est===1?'':'es'} sin RPE: cuento un 6. Apúntalo al acabar (botón «💪 RPE») para que sea exacto.</p>`:''}</div>`;
}

/* ═════════════ SIMULACROS B2 FIRST ═════════════
   Tablas oficiales de Cambridge (practice test score → Cambridge English Scale), interpolación lineal entre puntos. */
const B2T={r:{n:'Reading',max:42,a:[[10,122],[16,140],[24,160],[37,180],[42,190]]},u:{n:'Use of English',max:28,a:[[7,122],[11,140],[18,160],[24,180],[28,190]]},
  w:{n:'Writing',max:40,a:[[10,122],[16,140],[24,160],[34,180],[40,190]]},l:{n:'Listening',max:30,a:[[8,122],[12,140],[18,160],[27,180],[30,190]]},s:{n:'Speaking',max:60,a:[[14,122],[24,140],[36,160],[54,180],[60,190]]}};
function toScale(p,raw){if(raw==null||raw==='')return null;raw=+raw;const a=B2T[p].a;if(raw<a[0][0])return null;for(let i=1;i<a.length;i++)if(raw<=a[i][0]){const[x0,y0]=a[i-1],[x1,y1]=a[i];return Math.round(y0+(raw-x0)*(y1-y0)/(x1-x0));}return 190;}
function mockScore(m){const sc={};let sum=0,n=0;for(const p in B2T){if(m[p]==null||m[p]==='')continue;const v=toScale(p,m[p]);sc[p]=v;sum+=v==null?120:v;n++;}return{sc,n,overall:n?Math.round(sum/n):null};}
function grade(o){if(o==null)return['—','var(--muted)'];if(o>=180)return['A · nivel C1','#22C55E'];if(o>=173)return['B · aprobado','#22C55E'];if(o>=160)return['C · aprobado','#84CC16'];if(o>=140)return['B1 · no aprueba el B2','#FBBF24'];return['Por debajo de B1','#F87171'];}
function mockSheet(k){
  k=k||todayK();

    <div class="mock-grid" style="margin-top:12px"><b>Parte</b><b style="text-align:center">Puntos</b><b style="text-align:right">Escala</b>
    ${Object.entries(B2T).map(([p,x])=>`<span>${x.n} <small class="hint">/ ${x.max}</small></span><input type="number" inputmode="numeric" min="0" max="${x.max}" id="mk-${p}" oninput="mockLive()"><span class="sc" id="mks-${p}">—</span>`).join('')}</div>
    <div class="fp-goal" style="--hc:var(--acc)" id="mkTot"><b>Nota global: —</b><small>Aprobado B2: 160 · B: 173 · A (C1): 180</small></div>
    <p class="hint">Reading: partes 1, 5, 6, 7 (1, 2, 2, 1 punto por pregunta) · Use of English: partes 2, 3, 4 (la 4 vale 2) · Writing: 2 tareas de 0–20 · Speaking: 0–60 (si practicas con Claude, pídele que te puntúe).</p>
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn pri" onclick="saveMock()">Guardar</button></div>`);
