# Cada cambio en main: genera el calendario, pasa las pruebas y, si todo va bien, publica en GitHub Pages.
name: Probar y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar calendario
        run: python gen/build_ics.py
      - name: Probar el servidor de avisos
        run: cd worker && npm i --no-save http_ece@1 >/dev/null && node test.mjs
      - name: Comprobar los enlaces del plan
        run: python tests/check_links.py
      - name: Revisar la agenda
        run: python tests/test_agenda.py
      - name: Probar la app en un navegador
        run: |
          pip install playwright pillow numpy
          python -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          mkdir -p /tmp/t
          python tests/test_app.py
          python tests/test_sheet_movil.py
          python tests/test_drag_movil.py
          python tests/test_v19.py
          python tests/test_v110.py
          python tests/test_v111.py
          python tests/test_v113.py
          python tests/test_v114.py
          python tests/test_v115.py
          python tests/test_v117.py
          python tests/test_v118.py
          python tests/test_v119.py
          python tests/test_v120.py
          python tests/test_v121.py
          python tests/test_v122.py
          python tests/test_v123.py
          python tests/test_v124.py
          python tests/test_v125.py
          python tests/test_v126.py
          python tests/test_v127.py
          python tests/test_v128.py
          python tests/test_v129.py
          python tests/test_v130.py
          python tests/test_v131.py
          python tests/test_v133.py
          python tests/test_v134.py
          python tests/test_v135.py
      - name: Preparar la web
        run: |
          mkdir _site
          cp index.html plan.json sw.js manifest.webmanifest logo.png logo-a.png logo-p*.png icon-*.png favicon.png ironhabits.ics _site/ && cp -r splash _site/
      - name: Desplegar el servidor de avisos (Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Sin secretos de Cloudflare: la app se publica sin avisos push."
          else
            bash worker/deploy.sh && cp push.json _site/
          fi
      - name: Publicar en la rama gh-pages (GitHub Pages)
        run: |
          cp CHANGELOG.md _site/ && touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
