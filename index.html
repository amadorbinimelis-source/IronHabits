function mockRead(){const m={date:$('#mkD').value};for(const p in B2T){const v=$('#mk-'+p).value;if(v!==''){m[p]=Math.max(0,Math.min(B2T[p].max,+v));}}return m;}
function mockLive(){const m=mockRead(),r=mockScore(m);for(const p in B2T)$('#mks-'+p).textContent=m[p]==null?'—':(r.sc[p]==null?'<122':r.sc[p]);const[g,c]=grade(r.overall);$('#mkTot').innerHTML=`<b style="color:${c}">Nota global: ${r.overall??'—'} · ${g}</b><small>${r.n<5&&r.n?`Estimada con ${r.n} de 5 partes · `:''}Aprobado B2: 160 · B: 173 · A (C1): 180</small>`;}
function saveMock(){const m=mockRead();if(Object.keys(m).length<2)return toast('Pon al menos una parte');pushUndo();m.id=uid();S.mocks=S.mocks||[];S.mocks.push(m);S.mocks.sort((a,b)=>a.date<b.date?-1:1);save();closeSheet();render();const r=mockScore(m);toast(`🎯 ${r.overall} · ${grade(r.overall)[0]}`,[undoAct()]);}
async function delMock(id){if(!await ask('Se borrará este simulacro.','Borrar',true))return;pushUndo();S.mocks=S.mocks.filter(m=>m.id!==id);save();render();toast('Simulacro borrado',[undoAct()]);}
function mocksBlock(inDetail){
  const ms=(S.mocks||[]).slice(),en=getH('en');if(!ms.length&&!en)return '';
  const head=`<div class="sec">Simulacros B2 First${en&&en.goal?` · examen ${shortDate(en.goal.date)}`:''}</div>`;
  if(!ms.length)return head+`<div class="card"><p class="hint" style="margin:0 0 10px">Cuando hagas un test completo o una parte, apunta los puntos: te digo tu nota en la escala oficial y cuál es tu parte más floja.</p><button class="btn pri" onclick="mockSheet()">🎯 Registrar simulacro</button></div>`;
  const last=ms[ms.length-1],r=mockScore(last),[g,c]=grade(r.overall);
  const avgP={};for(const p in B2T){const v=ms.slice(-3).map(m=>m[p]!=null?(toScale(p,m[p])??120):null).filter(v=>v!=null);if(v.length)avgP[p]=v.reduce((a,b)=>a+b,0)/v.length;}
  const weak=Object.entries(avgP).sort((a,b)=>a[1]-b[1])[0];
  const series=ms.map(m=>mockScore(m).overall).filter(v=>v!=null);
  return head+`<div class="card">
    <div class="acwr"><b style="color:${c}">${r.overall??'—'}</b><div style="flex:1"><span class="zone" style="background:color-mix(in srgb,${c} 20%,transparent);color:${c}">${g}</span><p class="hint" style="margin:4px 0 0">Último: ${shortDate(last.date)}${r.n<5?` · ${r.n} de 5 partes`:''}</p></div>${spark(series.slice(-12),S.settings.accent||'#22C55E')}</div>
    ${weak?`<div class="rv-row">🎯 Parte más floja (últimos 3): <b>&nbsp;${B2T[weak[0]].n} (${Math.round(weak[1])})</b></div>`:''}
    ${Object.entries(B2T).map(([p,x])=>r.sc[p]!==undefined?`<div class="rv-row">${x.n}<span class="p" style="color:${(r.sc[p]??0)>=160?'#22C55E':'#FBBF24'}">${last[p]}/${x.max} → ${r.sc[p]??'<122'}</span></div>`:'').join('')}
    ${inDetail&&ms.length>1?`<div class="sec" style="margin-top:10px">Historial</div>${ms.slice().reverse().map(m=>{const q=mockScore(m);return `<div class="rv-row">${shortDate(m.date)} · ${q.n}/5 partes<span class="p">${q.overall}</span><button onclick="delMock('${m.id}')" style="margin-left:10px;color:var(--muted)">✕</button></div>`;}).join('')}`:''}
    <button class="btn ghost mt8" onclick="mockSheet()">🎯 Registrar simulacro</button></div>`;
}

/* ═════════════ COPIAS AUTOMÁTICAS EN EL MÓVIL (IndexedDB) ═════════════
   Una copia al día (se guardan los últimos 7 días) y otra antes de cada cambio grande:
   importar, borrar todo, cargar desde la nube, actualizar el plan o restaurar. Se recuperan en Ajustes. */
const SNAP_DB='rutina-copias',SNAP_DAYS=7,SNAP_PRE=6;
function snapDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('sin IndexedDB'));const r=indexedDB.open(SNAP_DB,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('snaps'))r.result.createObjectStore('snaps',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function snapRun(mode,fn){const db=await snapDB();return new Promise((res,rej)=>{const tx=db.transaction('snaps',mode),st=tx.objectStore('snaps');let out;
  const q=fn(st);if(q)q.onsuccess=()=>{out=q.result;};tx.oncomplete=()=>{db.close();res(out);};tx.onerror=tx.onabort=()=>{db.close();rej(tx.error);};});}
const snapList=()=>snapRun('readonly',st=>st.getAll()).then(a=>(a||[]).sort((x,y)=>x.at<y.at?1:-1));
async function writeSnap(kind,reason){
  if(!S.habits.length&&!Object.keys(S.logs).length)return;
  const now=new Date(),o={id:kind==='auto'?'auto-'+todayK():'pre-'+now.getTime(),kind,reason:reason||'',at:now.toISOString(),
    habits:S.habits.length,days:Object.keys(S.logs).length,state:lightState()};
  await snapRun('readwrite',st=>st.put(o));
  const all=await snapList(),autos=all.filter(x=>x.kind==='auto'),pres=all.filter(x=>x.kind==='pre');
  const drop=[...autos.slice(SNAP_DAYS),...pres.slice(SNAP_PRE)];
  if(drop.length)await snapRun('readwrite',st=>{drop.forEach(x=>st.delete(x.id));});
}
let _snapT=null;
function snapSoon(){clearTimeout(_snapT);_snapT=setTimeout(()=>writeSnap('auto').catch(()=>{}),4000);}
async function safetySnap(reason){try{await writeSnap('pre',reason);}catch(e){}}
async function snapSheet(){
  let all=[];try{all=await snapList();}catch(e){}
  openSheet(`<div class="sheet-title">🗂️ Copias automáticas</div>
    <p class="hint">Se guardan solas en este móvil: una al día (los últimos ${SNAP_DAYS} días) y otra antes de cada cambio grande. Sirven si algo sale mal; para no perder nada si pierdes el móvil, usa también la nube o la copia en Drive.</p>
    ${all.length?all.map(x=>`<div class="cx" style="border-style:solid">${x.kind==='auto'?'📅':'🛟'}<span><b style="color:var(--text)">${new Date(x.at).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})}</b><br>${esc(x.reason||'Copia del día')} · ${x.habits} hábitos · ${x.days} día${x.days===1?'':'s'} con registros</span><button onclick="restoreSnap('${x.id}')">Restaurar</button></div>`).join(''):'<p class="hint">Todavía no hay ninguna. La primera se guarda unos segundos después de cualquier cambio.</p>'}
    <p class="hint">${_persist===true?'🔒 El sistema ha marcado los datos de la app como persistentes: no los borra para liberar espacio.':_persist===false?'Este navegador no garantiza conservar los datos. En iPhone, tenerla instalada en la pantalla de inicio es lo que los protege.':''}</p>`);
}
async function restoreSnap(id){
  let x=null;try{x=(await snapList()).find(s=>s.id===id);}catch(e){}if(!x)return toast('No encuentro esa copia');
  if(!await ask(`Volver a como estaba el ${new Date(x.at).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})} (${x.days} días con registros). Antes guardo otra copia de lo que tienes ahora.`,'Restaurar'))return;
  await safetySnap('Antes de restaurar una copia');await applyState(x.state);toast('Copia restaurada ✅');
}
// Sustituye todos los datos por otro estado (copia, nube) conservando el plan pesado de este móvil o recargándolo
async function applyState(state){
  dropUndo();
  localStorage.setItem(KEY,JSON.stringify(state));S=load();
  if(!S.habits.some(h=>h.plan&&h.plan.program))S.packs={};
  save();applyAccent();sel=todayK();await autoPlan();render();
}
// Pedir al navegador que no borre los datos para liberar espacio
let _persist=null;
async function askPersist(){try{if(navigator.storage&&navigator.storage.persist)_persist=(await navigator.storage.persisted())||(await navigator.storage.persist());}catch(e){}}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function isStandalone(){return navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);}

/* ═════════════ NUBE: copia automática y sincronización (gists secretos de GitHub) ═════════════
   Dos gists separados: uno con tus datos y otro solo con el calendario (el que se comparte con
   el Calendario del iPhone o Google). Así el enlace del calendario no lleva a tus datos.
   El código de acceso solo tiene permiso de gists y se guarda únicamente en este dispositivo (no va en las copias). */
const CLOUD_KEY='rutina_cloud',DATA_FILE='rutina-datos.json',ICS_FILE='rutina-agenda.ics';
function cloudCfg(){try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||'null');}catch(e){return null;}}
function cloudSave(c){try{if(c)localStorage.setItem(CLOUD_KEY,JSON.stringify(c));else localStorage.removeItem(CLOUD_KEY);}catch(e){}}
function cloudLegacy(c){return !!(c&&c.gistId&&!c.icsGist);} // formato antiguo: datos y calendario en el mismo gist
function cloudPending(c){return !!(c&&c.dirtyAt&&c.dirtyAt>(c.lastPushAt||0));}
function cloudICS(){const c=cloudCfg();return c&&c.gistId?`https://gist.githubusercontent.com/${c.login}/${c.icsGist||c.gistId}/raw/${ICS_FILE}`:null;}
async function gh(path,opt={}){
  const c=cloudCfg()||{};const r=await fetch('https://api.github.com'+path,{method:opt.method||'GET',body:opt.body,cache:'no-store',keepalive:!!opt.keepalive,
    headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+(opt.token||c.token),...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e;}return r.status===204?null:r.json();
}
function lightState(){return JSON.parse(JSON.stringify(S,(k,v)=>HEAVY.has(k)||k==='_needPlanSave'?undefined:v));}
function devName(){const u=navigator.userAgent;return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':'Ordenador';}
function agendaHash(){const s=JSON.stringify([S.agenda,S.habits.map(h=>[h.id,h.archived,h.plan&&h.plan.dates]),S.agendaUntil]);let x=0;for(let i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))|0;return x;}
function dataFile(savedAt){return {content:JSON.stringify({kind:'rutina-sync',savedAt,device:devName(),state:lightState()})};}
function icsFile(){const t=todayK();return {content:buildICS(addDays(t,-7),S.agendaUntil||addDays(t,60),false,300).text};}
// Si hubiera varios (p. ej. de pruebas), el más reciente
function pickGist(list,fn){return (list||[]).filter(g=>g.files&&fn(g.files)).sort((a,b)=>(b.updated_at||'')>(a.updated_at||'')?1:-1)[0];}
async function newGist(tok,desc,files){return gh('/gists',{token:tok,method:'POST',body:JSON.stringify({description:desc,public:false,files})});}
const DATA_DESC='Rutina · tus datos (privado: no compartas este enlace)',ICS_DESC='Rutina · calendario';
let _cloudT=null,_cloudBusy=false,_cloudApplying=false;
function cloudDirty(){const c=cloudCfg();if(!c||!c.gistId||_cloudApplying)return;c.dirtyAt=Date.now();cloudSave(c);clearTimeout(_cloudT);_cloudT=setTimeout(cloudPush,6000);}
function cloudErr(e){const c2=cloudCfg();if(!c2)return;c2.err=e.status===401?'auth':'net';cloudSave(c2);if(e.status===404)cloudRediscover();}
async function cloudPush(force,opt={}){
  const c=cloudCfg();if(!c||!c.gistId||_cloudBusy)return;if(!force&&c.lastSync&&!cloudPending(c))return;
  _cloudBusy=true;const startedAt=Date.now();
  try{
    const savedAt=new Date().toISOString(),files={[DATA_FILE]:dataFile(savedAt)};
    // Al salir de la app solo se suben los datos, con keepalive para que iOS no corte el envío
    const hsh=agendaHash(),ics=!opt.hidden&&(force||hsh!==c.icsHash||!c.icsAt||Date.now()-c.icsAt>6*3600e3)?icsFile():null;
    if(ics&&!c.icsGist)files[ICS_FILE]=ics;
    const body=JSON.stringify({files});
    await gh('/gists/'+c.gistId,{method:'PATCH',body,keepalive:!!opt.hidden&&body.length<60000});
    if(ics&&c.icsGist)await gh('/gists/'+c.icsGist,{method:'PATCH',body:JSON.stringify({files:{[ICS_FILE]:ics}})});
    const c2=cloudCfg()||c;c2.lastSync=savedAt;c2.lastPushAt=startedAt;c2.err=null;if(ics){c2.icsHash=hsh;c2.icsAt=Date.now();}cloudSave(c2);
  }catch(e){cloudErr(e);}
  finally{_cloudBusy=false;if(view==='set')renderSet();}
}
async function cloudRemote(c){const g=await gh('/gists/'+c.gistId);const f=g.files&&g.files[DATA_FILE];if(!f)return null;let txt=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-store'});txt=await r.text();}return JSON.parse(txt);}
async function cloudApply(remote){
  await safetySnap('Antes de cargar desde la nube');

  try{await applyState(remote.state);}finally{_cloudApplying=false;}
  const c=cloudCfg();if(c){c.lastSync=remote.savedAt;c.dirtyAt=0;c.lastPushAt=Date.now();cloudSave(c);}
}
async function cloudPull(){
  const c=cloudCfg();if(!c||!c.gistId)return;
  try{const rm=await cloudRemote(c);
    if(rm&&rm.savedAt&&!(c.lastSync&&rm.savedAt<=c.lastSync)){
      if(cloudPending(c)){if(!await ask(`Hay cambios en la nube desde ${rm.device||'otro dispositivo'} (${new Date(rm.savedAt).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}) y también cambios en este. ¿Cargar los de la nube? Si dices que no, se quedan los de este dispositivo. Antes de cargar guardo una copia automática.`,'Cargar los de la nube'))return cloudPush(true);}
      await cloudApply(rm);toast(`☁️ Datos actualizados desde ${rm.device||'la nube'}`);return;
    }
    // Nada nuevo en la nube: si quedaron cambios sin subir (p. ej. se cerró la app a medias), se suben ahora
    if(cloudPending(cloudCfg()))await cloudPush();
  }catch(e){cloudErr(e);}
}
// Si el gist ya no existe (se separó desde otro dispositivo), busca los nuevos con el mismo código
let _rediscovering=false;
async function cloudRediscover(){
  const c=cloudCfg();if(!c||!c.token||_rediscovering)return;_rediscovering=true;
  try{const list=await gh('/gists?per_page=100');
    const d=pickGist(list,f=>f[DATA_FILE]),i=pickGist(list,f=>f[ICS_FILE]&&!f[DATA_FILE]);
    if(!d){const c2=cloudCfg();if(c2){c2.err='gone';cloudSave(c2);}return;}
    const c2=cloudCfg()||c;c2.gistId=d.id;c2.icsGist=i?i.id:null;c2.err=null;c2.lastSync=null;cloudSave(c2);
    await cloudPull();
  }catch(e){}finally{_rediscovering=false;if(view==='set')renderSet();}
}
// Mejora de privacidad para quien conectó la nube antes de la v1.10 (todo en un gist)
async function cloudMigrate(){
  const c=cloudCfg();if(!cloudLegacy(c))return;
  if(!await ask('Ahora tus datos de la nube (registros, notas, sueño y energía) están en la misma nota de GitHub que el calendario, y con el enlace del calendario se podría llegar a ellos. Los separo en dos notas nuevas y borro la antigua de GitHub. Tus datos siguen en este móvil y en la nota nueva. Después tendrás que volver a suscribirte al calendario una vez.','Separar y proteger'))return;
  try{
    const savedAt=new Date().toISOString();
    const d=await newGist(c.token,DATA_DESC,{[DATA_FILE]:dataFile(savedAt)});
    const i=await newGist(c.token,ICS_DESC,{[ICS_FILE]:icsFile()});
    const old=c.gistId,c2={...cloudCfg(),gistId:d.id,icsGist:i.id,lastSync:savedAt,lastPushAt:Date.now(),icsHash:agendaHash(),icsAt:Date.now(),err:null,resub:true};
    cloudSave(c2);
    let gone=true;try{await gh('/gists/'+old,{method:'DELETE'});}catch(e){gone=false;}
    render();toast(gone?'🔒 Nube separada y protegida':'🔒 Separada · no pude borrar la nota antigua: bórrala en gist.github.com');
    subscribeSheet();
  }catch(e){toast(e.status===401?'❌ El código ha caducado: vuelve a conectar':'❌ No se pudo completar. Tus datos siguen igual; inténtalo con conexión');}
}
function cloudRow(){

function cloudSheet(){

    <p class="hint">Usa tu cuenta de GitHub: tus datos se guardan en un <b>gist secreto</b> (una nota privada que solo ves tú) y el calendario en otro aparte. Una vez conectado no tienes que hacer nada más.</p>
    <div class="sec">1 · Crea un código de acceso</div>
    <a class="btn pri" style="display:block;text-align:center;text-decoration:none" href="https://github.com/settings/tokens/new?scopes=gist&description=Rutina%20app" target="_blank" rel="noopener">Abrir GitHub</a>

    <div class="sec">2 · Pégalo aquí</div>

    <p class="hint">Este código solo permite crear y editar tus gists. Se guarda solo en este dispositivo y no va en las copias.</p>
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn pri" id="tokBtn" onclick="cloudConnect()">Conectar</button></div>`);

async function cloudConnect(tokArg){
  const tok=(tokArg||($('#tokIn')||{}).value||'').trim();if(!/^(ghp_|github_pat_|gho_)/.test(tok))return toast('Ese código no parece válido (empieza por ghp_)');

async function cloudForcePull(){const c=cloudCfg();if(!c)return;try{const rm=await cloudRemote(c);if(!rm)return toast('No hay datos en la nube');if(!await ask('Se sustituirá lo de este dispositivo por lo de la nube. Antes guardo una copia automática.','Cargar'))return;await cloudApply(rm);toast('☁️ Datos cargados');}catch(e){toast('❌ No se pudo cargar');}}

// Al salir de la app: guarda la nota a medio escribir, la copia del día y sube los cambios
function flushOnHide(){if(setNote._t){clearTimeout(setNote._t);setNote._t=null;save();}if(_snapT){clearTimeout(_snapT);_snapT=null;writeSnap('auto').catch(()=>{});}clearTimeout(_cloudT);cloudPush(false,{hidden:true});}

/* ═════════════ PLAN COMPLETO ═════════════ */
function planEnd(h){const pr=h.plan&&h.plan.program?Object.keys(h.plan.program).sort():[];return (h.goal&&h.goal.date)||pr[pr.length-1]||S.agendaUntil||addDays(todayK(),90);}
function goalBox(h){
  const end=planEnd(h),t=todayK(),left=diffDays(t,end);if(left<0&&!h.goal)return '';
  const all=planDates(h),fut=all.filter(k=>k>=t&&!isCancelledH(h,k)).length,done=all.filter(k=>k<t&&isDone(h,k)).length+(isDone(h,t)?1:0);
  return `<div class="fp-goal"><b>🎯 ${esc(h.goal?h.goal.label:'Fin del plan')} · ${longDate(end)} de ${end.slice(0,4)}</b><small>${left>=0?`Faltan ${left} días (${Math.ceil(left/7)} semanas) · quedan ${fut} sesiones · llevas ${done}`:'Plan terminado'}</small></div>`;
}
// Todos los días en que este hábito tiene algo: plan del día, programación, movidos, extras y registros
function planDates(h){
  const set=new Set(),end=planEnd(h),p=h.plan||{};
  for(const k of Object.keys(p.program||{}))set.add(k);
  for(const k of Object.keys(p.dates||{}))set.add(k);
  if(h.schedule.mode!=='dates'&&h.schedule.mode!=='xweek'){let k=h.start,g=0;while(k<=end&&g++<800){if(isScheduled(h,k))set.add(k);k=addDays(k,1);}}
  for(const k in S.agenda||{})if(S.agenda[k]['in:'+h.id])set.add(k);
  for(const k in S.logs)if(S.logs[k][h.id])set.add(k);
  return [...set].filter(k=>k>=h.start||(S.logs[k]&&S.logs[k][h.id])).sort();
}
function fpStatus(h,k){
  const t=todayK(),o=agOv(k,'h:'+h.id);
  if(isDone(h,k))return ['✅','Hecho'];
  if(o&&o.moveTo)return ['↪️',`Movido al ${shortDate(o.moveTo)}`];
  if(o&&o.cancel)return [o.pause?'🏖️':'⊘',o.reason||'Anulado'];
  if(isExtra(h,k))return ['➕','Sesión extra'];
  if(k===t)return ['👉','Hoy'];
  if(k<t)return missCounts(h,k)?['❌','No hecho']:['〰️','Compensado en la semana'];
  return ['',''];
}
let FP={id:null,f:'next',q:''};
function fullPlan(id,k){FP={id,f:'next',q:''};renderFP();if(k)setTimeout(()=>fpGo(k),60);else setTimeout(()=>fpGo(todayK()),60);}
function renderFP(){
  const h=getH(FP.id);if(!h)return;const t=todayK(),q=FP.q.trim().toLowerCase();
  let ds=planDates(h);
  if(FP.f==='next')ds=ds.filter(k=>k>=t);else if(FP.f==='done')ds=ds.filter(k=>isDone(h,k));
  const rows=ds.map(k=>{const pl=planFor(h,k)||{text:'',tag:''};return{k,pl}}).filter(x=>!q||(x.pl.tag+' '+x.pl.text).toLowerCase().includes(q));
  let html='',month='';
  for(const{k,pl}of rows){
    const mk=k.slice(0,7);if(mk!==month){month=mk;const n=rows.filter(r=>r.k.slice(0,7)===mk).length;html+=`<div class="fp-month">${MONTHS[+k.slice(5,7)-1]} ${k.slice(0,4)} · ${n} sesion${n===1?'':'es'}</div>`;}
    const[ic,lb]=fpStatus(h,k),title=pl.tag||(pl.text||h.name).split('\n')[0];
    html+=`<div class="fp-item ${k===t?'today':k<t?'past':''}" id="fp-${k}"><button class="fp-row" onclick="fpToggle('${k}')"><span class="d"><b>${DOW_N[dow(k)].slice(0,3).toLowerCase()} ${+k.slice(8)}</b>${lb?esc(lb):''}</span><span class="t">${esc(title)}</span><span class="s">${ic}</span></button><div class="fp-body" id="fpb-${k}" style="display:none"></div></div>`;
  }
  openSheet(`<div style="--hc:${h.color}"><div class="sheet-title">🗓️ ${esc(h.emoji)} ${esc(h.name)} · plan completo</div>
    ${goalBox(h)}
    <div class="fp-tools"><div class="seg">${[['next','Próximas'],['all','Todas'],['done','Hechas']].map(([v,l])=>`<button class="${FP.f===v?'on':''}" onclick="FP.f='${v}';renderFP()">${l}</button>`).join('')}</div>
      <div class="row"><input id="fpQ" placeholder="Buscar: Speaking, Test 3, pierna, isla…" value="${esc(FP.q)}" oninput="FP.q=this.value;clearTimeout(window._fpT);window._fpT=setTimeout(()=>{renderFP();const i=$('#fpQ');i.focus();i.setSelectionRange(i.value.length,i.value.length);},350)"><button class="btn ghost" style="width:auto;padding:10px 14px" onclick="fpGo(todayK())">Hoy</button></div></div>
    <p class="hint">${rows.length} sesiones${q?' con «'+esc(FP.q)+'»':''}. Toca una para ver exactamente qué hacer.</p>
    ${html||'<p class="hint">No hay sesiones con ese filtro.</p>'}</div>`);
}
function fpToggle(k){
  const b=$('#fpb-'+k),h=getH(FP.id);if(!b||!h)return;
  if(b.style.display==='none'){const pl=planFor(h,k);
    b.innerHTML=`${pl&&pl.text?`<div class="hc-plan">${pl.tag?`<div class="pl-tag">${esc(pl.tag)}</div>`:''}${fmtPlan(pl.text)}</div>`:'<p class="hint">Sin plan detallado este día.</p>'}<div class="btns" style="margin-top:8px"><button class="btn ghost" onclick="closeSheet();pick('${k}');go('hoy')">Abrir este día</button><button class="btn ghost" onclick="evSheet('${k}','h:${h.id}')">Mover o anular</button></div>`;
    b.style.display='block';}else b.style.display='none';
}
function fpGo(k){
  const h=getH(FP.id);if(!h)return;const ds=planDates(h);const tgt=ds.find(d=>d>=k)||ds[ds.length-1];
  if(!tgt)return;if(!$('#fp-'+tgt)){FP.f='all';FP.q='';renderFP();}
  const el=$('#fp-'+tgt);if(el){el.scrollIntoView({block:'center'});}
}

/* ═════════════ TOTAL SEMANAL ═════════════ */
function weekCard(k){
  const hs=S.habits.filter(h=>!h.archived&&weekGoal(h,k)>0);if(!hs.length)return '';
  const ws=weekStartK(k);let G=0,M=0;
  const rows=hs.map(h=>{const g=weekGoal(h,k),m=weekMins(h,k);G+=g;M+=Math.min(m,g);const p=Math.min(1,m/g);
    return `<button class="wk-row" onclick="openDetail('${h.id}')"><span>${esc(h.emoji)}</span><div><div class="nm">${esc(h.name)}</div><div class="wk-bar"><i style="width:${Math.round(p*100)}%;background:${h.color}"></i></div></div><span class="vl"><b>${fmtDur(m)}</b> / ${fmtDur(g)}${m>=g?' ✓':''}</span></button>`;}).join('');
  const open=OPEN['wk']!==false;
  return `<div class="card wk-card"><button class="wk-hd" style="width:100%" onclick="OPEN['wk']=${open?'false':'true'};render()"><b>📊 ${ws===weekStartK(todayK())?'Esta semana':'Total semanal'} · ${Math.round(M/G*100)}%</b><small>${shortDate(ws)}–${shortDate(addDays(ws,6))} ${open?'▴':'▾'}</small></button>${open?rows+'<p class="hint" style="margin:6px 0 0">Si un día no puedes, compénsalo otro día de la semana: si llegas al total, no cuenta como fallo.</p>':''}</div>`;
}
function weekHistBlock(h){
  const t=todayK();if(!(weekGoal(h,t)>0||weekMins(h,t)>0))return '';
  const n=Math.min(10,weeksSince(h.start,10,1)),bars=[];let mx=1;
  for(let i=n-1;i>=0;i--){const k=addDays(weekStartK(t),-7*i),g=weekGoal(h,k),m=weekMins(h,k);mx=Math.max(mx,g,m);bars.push({k,g,m});}
  const H=56;
  return `<div class="sec">Total semanal</div><div class="card" style="margin-bottom:0"><div class="wk-hd"><b>${fmtDur(weekMins(h,t))} de ${fmtDur(weekGoal(h,t))} esta semana</b><small>${bars.filter(b=>b.g&&b.m>=b.g).length}/${bars.filter(b=>b.g).length} semanas cumplidas</small></div>
    <div class="wk-hist">${bars.map(b=>`<div title="${fmtDur(b.m)} / ${fmtDur(b.g)}"><i style="height:${Math.max(2,Math.round(b.m/mx*H))}px;background:${b.g&&b.m>=b.g?h.color:'color-mix(in srgb,'+h.color+' 40%,transparent)'}"></i><span>${shortDate(b.k).split(' ')[0]}</span></div>`).join('')}</div></div>`;
}
function minsSheet(id,k){
  const h=getH(id);if(!h)return;const cur=Math.round(minsOf(h,k));
  openSheet(`<div style="--hc:${h.color}"><div class="sheet-title">⏱ ${esc(h.emoji)} ${esc(h.name)}</div><div class="sub mb12">${longDate(k)} · previsto ${fmtDur(evDur(h,k))}</div>
    <p class="hint">Pon lo que has hecho de verdad. Suma a tu total de la semana: si un día haces más, compensa el que no pudiste.</p>
    <div class="two" style="margin-top:10px"><div><label class="lbl" style="margin-top:0">Horas</label><input type="number" inputmode="numeric" min="0" id="mnH" value="${Math.floor(cur/60)}"></div><div><label class="lbl" style="margin-top:0">Minutos</label><input type="number" inputmode="numeric" min="0" max="59" id="mnM" value="${cur%60}"></div></div>
    <div class="btns">${[30,45,60,90].map(v=>`<button class="btn ghost" onclick="$('#mnH').value=${Math.floor(v/60)};$('#mnM').value=${v%60}">${fmtDur(v)}</button>`).join('')}</div>
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn pri" onclick="saveMins('${id}','${k}')">Guardar</button></div></div>`);
}
function saveMins(id,k){
  const h=getH(id),v=(parseInt($('#mnH').value)||0)*60+(parseInt($('#mnM').value)||0);
  if(v<0||v>16*60)return toast('Revisa el tiempo');
  pushUndo();const was=isDone(h,k),e=ens(h,k);
  if(h.type==='time')e.v=v;else if(v>0)e.mins=v;else delete e.mins;
  closeSheet();commit(h,k,was);
}

/* ═════════════ SESIONES EXTRA ═════════════ */
function typicalDur(h){for(const k in S.agendaBase||{}){const e=S.agendaBase[k].find(x=>x.id==='h:'+h.id);if(e)return tm(e.end)-tm(e.start);}return h.type==='time'&&h.target?h.target:60;}
function extraSheet(k){
  const opts=S.habits.filter(h=>!h.archived&&!showOn(h,k));
  if(!opts.length)return toast('Ese día ya tienes todos tus hábitos');
  openSheet(`<div class="sheet-title">➕ Sesión extra</div><div class="sub mb12">${longDate(k)}</div>
    <p class="hint">Haz un hábito un día que no le toca. Si lo completas, suma a su progreso, sus estadísticas y su racha; si al final no lo haces, no cuenta como fallo.</p>
    <label class="lbl">Qué</label><select id="exH">${opts.map(h=>`<option value="${h.id}">${esc(h.emoji)} ${esc(h.name)}</option>`).join('')}</select>
    <label class="lbl">Hora de inicio</label><input type="time" id="exS" value="">
    <p class="hint">Déjala vacía y busco el primer hueco libre a partir de las 18:00.</p>
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn pri" onclick="addExtra('${k}')">Añadir</button></div>`);
}
function addExtra(k){
  const h=getH($('#exH').value);if(!h)return;const dur=typicalDur(h),v=$('#exS').value;
  const st=v?tm(v):freeSlot(k,dur,18*60);
  pushUndo();agSet(k,'in:'+h.id,{extra:true,start:fmtT(st),end:fmtT(st+dur)});
  const ov=overlaps(k,'h:'+h.id,st,st+dur);
  afterAg(`${h.emoji} ${h.name} extra a las ${fmtT(st)}${ov.length?` · coincide con ${ov[0]}`:''}`);
}
function removeExtra(k,hid){
  pushUndo();agSet(k,'in:'+hid,null);
  if(S.logs[k]&&S.logs[k][hid]){delete S.logs[k][hid];if(!Object.keys(S.logs[k]).length)delete S.logs[k];}
  afterAg('Sesión extra quitada');
}

function icsURL(){const u=new URL('rutina.ics',location.href);return u.protocol==='https:'&&!/claude\.(ai|site)|claudeusercontent/.test(u.host)?u.href:null;}

  {const cc=cloudCfg();if(cc&&cc.resub){cc.resub=false;cloudSave(cc);}}

/* ═════════════ SHEET ═════════════ */
function openSheet(html,keep){
  if(html!==null&&html!==undefined)$('#sheetBody').innerHTML=html;
  $('#sheet').scrollTop=0;
  // Una entrada en el historial por hoja abierta (para cerrarla con «atrás»). Si aún hay un «atrás» pendiente de la hoja
  // anterior (abrir una hoja justo al cerrar otra, p. ej. dos confirmaciones seguidas), se vuelve a añadir cuando llegue.
  if(!$('#sheet').classList.contains('on')&&!_pushed){if(_skipPop){_pushed=true;_deferPush=true;}else{try{history.pushState({sheet:1},'');_pushed=true;}catch(e){}}}
  $('#ov').classList.add('on');$('#sheet').classList.add('on');document.body.style.overflow='hidden';
}
var _skipPop=false,_pushed=false,_deferPush=false;
try{if(history.state&&history.state.sheet)history.replaceState(null,'');}catch(e){}
function closeSheet(fromPop){
  if(!$('#sheet').classList.contains('on'))return;
  if(_pushed){_pushed=false;if(_deferPush)_deferPush=false;else if(!fromPop){_skipPop=true;try{history.back();}catch(e){_skipPop=false;}}}
  $('#sheet').style.transform='';
  $('#ov').classList.remove('on');$('#sheet').classList.remove('on');document.body.style.overflow='';D=null;if(_dlg){const r=_dlg;_dlg=null;r(false);}}

/* ═════════════ INICIO ═════════════ */
let _lastDay=todayK();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const t=todayK();if(t!==_lastDay){if(sel===_lastDay)sel=t;_lastDay=t;}
  render();
});
applyAccent();
addEventListener('popstate',()=>{if(_skipPop){_skipPop=false;if(_deferPush){_deferPush=false;try{history.pushState({sheet:1},'');}catch(e){}}return;}if($('#sheet').classList.contains('on'))closeSheet(true);});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
(function(){ // deslizar la hoja hacia abajo para cerrarla
  const sh=$('#sheet');let y0=null,dy=0,fromTop=false;
  sh.addEventListener('touchstart',e=>{fromTop=e.target.closest('#sheetTop')||sh.scrollTop<=0;y0=fromTop?e.touches[0].clientY:null;dy=0;},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0&&(sh.scrollTop<=0||e.target.closest('#sheetTop'))){sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`;}else if(dy<0){y0=null;sh.style.transform='';}},{passive:true});
  sh.addEventListener('touchend',()=>{sh.style.transition='';if(y0!==null&&dy>110)closeSheet();else sh.style.transform='';y0=null;},{passive:true});
})();
swipeWeek($('#wkDays'));swipeWeek($('#agWeek'));
if(S._needPlanSave){delete S._needPlanSave;savePlan();save();}
render();
askPersist();
autoPlan().then(()=>cloudPull()).then(()=>snapSoon());
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
